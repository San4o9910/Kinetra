pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  # Optional: the single-server validator permits one exact observed edge peer.
  # An unmatched include glob keeps the base deployment valid without trust.
  include /etc/nginx/kinetra-edge/*.conf;
  default_type application/octet-stream;
  server_tokens off;
  # Deliberately exclude IP, URI, query, cookie, referrer and user-agent.
  log_format privacy '$request_method $status $body_bytes_sent $request_time';
  access_log /dev/stdout privacy;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  sendfile on;
  keepalive_timeout 65;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    # Build-generated meta CSP further restricts private image/media origins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /ready { return 404; }
    location = /health {
      proxy_pass http://backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 130s;
    }
    location ~ ^/api/v1/chat/conversations/[0-9a-f-]+/photos$ {
      client_max_body_size 11m;
      proxy_request_buffering off;
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 130s;
    }
    location /socket.io/ {
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 75s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location ~ /\. { deny all; }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { expires -1; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
