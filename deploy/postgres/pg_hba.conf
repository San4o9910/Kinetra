# Bootstrap administration requires OS postgres access inside this container.
local all kinetra_bootstrap peer map=kinetra_bootstrap
local all all reject
# Only TLS + SCRAM for the application database, only these runtime identities.
# PostgreSQL is attached only to the private internal Docker database network.
hostssl kinetra kinetra_migrate,kinetra_api,kinetra_notifications,kinetra_renewals,kinetra_chat_cleanup,kinetra_video_cleanup,kinetra_video_verify all scram-sha-256
host all all all reject
