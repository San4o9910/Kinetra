listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770
hba_file = '/etc/kinetra-postgres/pg_hba.conf'
ident_file = '/etc/kinetra-postgres/pg_ident.conf'
ssl = on
ssl_cert_file = '/run/kinetra-postgres/server.crt'
ssl_key_file = '/run/kinetra-postgres/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# One API pool (10), one job pool (2), migrations and reserved maintenance.
max_connections = 32
superuser_reserved_connections = 3
shared_buffers = '256MB'
effective_cache_size = '768MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
autovacuum_work_mem = '32MB'
autovacuum_max_workers = 2
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
temp_file_limit = '64MB'
min_wal_size = '128MB'
max_wal_size = '1GB'
wal_keep_size = 0
max_replication_slots = 0
max_wal_senders = 0
checkpoint_completion_target = 0.9
statement_timeout = '30s'
lock_timeout = '5s'
idle_in_transaction_session_timeout = '60s'
timezone = 'UTC'

# Container log rotation provides retention. Do not log SQL, bound parameters,
# connection identities or statements containing credential/medical data.
logging_collector = off
log_destination = 'stderr'
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_error_verbosity = terse
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] '
