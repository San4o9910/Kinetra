<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b7f36b" />
    <title>Kinetra — нет подключения</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090c10;
        color: #f4f7ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(183, 243, 107, 0.16), transparent 28rem),
          #090c10;
      }

      main {
        width: min(520px, 100%);
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        background: rgba(22, 28, 36, 0.9);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin-bottom: 24px;
        place-items: center;
        border-radius: 17px;
        color: #10150c;
        background: #b7f36b;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 9vw, 52px);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 20px 0 0;
        color: #aeb6c2;
        font-size: 17px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 28px;
        border: 0;
        border-radius: 14px;
        color: #10150c;
        background: #b7f36b;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">K</div>
      <h1>Сейчас нет сети</h1>
      <p>
        Kinetra не смог загрузить страницу из интернета. Проверьте подключение и повторите
        попытку.
      </p>
      <button type="button" onclick="window.location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
