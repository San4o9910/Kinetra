<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080909" />
    <meta name="color-scheme" content="dark light" />
    <script src="/theme-init.js"></script>
    <title>Kinetra — нет подключения</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #080909;
        color: #f4f6f2;
        --background: #080909;
        --surface: #181c1c;
        --text: #f4f6f2;
        --muted: #a8b0ac;
        --border: rgba(244, 246, 242, 0.11);
        --accent: #c8f169;
        --accent-ink: #0b0e09;
        --shadow: rgba(0, 0, 0, 0.45);
      }

      :root[data-theme='light'] {
        background: #f4f6f2;
        color: #111414;
        --background: #f4f6f2;
        --surface: #ffffff;
        --text: #111414;
        --muted: #5d6662;
        --border: rgba(17, 20, 20, 0.12);
        --accent: #c8f169;
        --accent-ink: #0b0e09;
        --shadow: rgba(22, 30, 25, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(200, 241, 105, 0.16), transparent 28rem),
          var(--background);
      }

      main {
        width: min(520px, 100%);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 30px 80px var(--shadow);
      }

      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin-bottom: 24px;
        place-items: center;
        border-radius: 17px;
        color: var(--accent-ink);
        background: var(--accent);
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 9vw, 52px);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 28px;
        border: 0;
        border-radius: 14px;
        color: var(--accent-ink);
        background: var(--accent);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">K</div>
      <h1>Сейчас нет сети</h1>
      <p>
        Kinetra не смог загрузить страницу из интернета. Проверьте подключение и повторите попытку.
      </p>
      <button type="button" onclick="window.location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
