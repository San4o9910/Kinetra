# DORMANT REVIEW COPY: this path is not a GitHub Actions workflow.
# Root must fill every REVIEW_REQUIRED value from actual successful evidence,
# then publish the reviewed copy as .github/workflows/timeweb-database-initialization.yml.
# One first initialization on existing server 9069403; no API/frontend/provider activation.
name: Initialize approved empty Kinetra database on existing hourly host

on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/timeweb-database-initialization.yml]

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read

concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false

env:
  ACTIVATE_DATABASE_INITIALIZATION: REVIEW_REQUIRED
  APPROVED_APP_COMMIT: REVIEW_REQUIRED
  APPROVED_BASE_COMMIT: REVIEW_REQUIRED
  APPROVED_MERGE_COMMIT: REVIEW_REQUIRED
  APPROVED_HEAD_RUN: REVIEW_REQUIRED
  APPROVED_MERGE_RUN: REVIEW_REQUIRED
  APPROVED_IMAGE_RUN: REVIEW_REQUIRED
  APPROVED_IMAGE_CONTROL_COMMIT: REVIEW_REQUIRED
  APPROVED_IMAGE_WORKFLOW_SHA256: REVIEW_REQUIRED
  APPROVED_IMAGE_ARTIFACT_ID: REVIEW_REQUIRED
  APPROVED_IMAGE_ARTIFACT_SHA256: REVIEW_REQUIRED
  NODE_IMAGE: REVIEW_REQUIRED
  NGINX_IMAGE: REVIEW_REQUIRED
  BACKEND_IMAGE: REVIEW_REQUIRED
  FRONTEND_IMAGE: REVIEW_REQUIRED
  POSTGRES_IMAGE: REVIEW_REQUIRED
  ROOT_SUPPLIED_SERVER_ID: '9069403'
  ROOT_SUPPLIED_SERVER_IP: 80.68.156.131

jobs:
  initialize-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed control scripts and explicit activation inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = San4o9910/Kinetra
          test "$GITHUB_REF" = refs/heads/ops/timeweb-hourly-preflight-20260909
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ACTIVATE_DATABASE_INITIALIZATION" = APPROVED
          sha256sum --check --strict <<'SHA256'
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          a19aca3ea953feecdcb9be6e9dcabdfc8b0e2b4f3938184391cdfb2ff3e87c9e  ops/timeweb/bootstrap-server.py
          4621b1c0153ab56ae535e245fdb2de4ef2aff4a30ba5b592343a26795f0655ae  ops/timeweb/prepare-database-host.py
          041f415dedf6b0b6922484281926c8c98c87828506dcb2e1ac6fb324b00b05bb  ops/timeweb/initialize-database-host.py
          29e2c69ee0e507574183a4f5a8bbd3c0ae306d0a0ed0b46dcb3043889e1b1dac  ops/timeweb/test-prepare-database-host.py
          5e26395c85ef64b99f045b5ba46bc92d72ffc595f0cb5640a571a599ad8ccea5  ops/timeweb/test-initialize-database-host.py
          f5d31335b0c7667480d2da9938e5604d1d2cdda5c5ef6df3880c41b979c2038e  ops/timeweb/application-caller.py
          461f4738f3d0c67890b9c57f0756149c0fa7423918adedf8c7d05f19e5978b46  ops/timeweb/verify-launch-provenance.py
          b2b9b584612a4821e981f55e8318cafab872a481367af1a8697fb966d60f2345  ops/timeweb/test-application-caller.py
          ba9d7f7d4a5475de9a4401be60694bcbeab1e62308d2f304454360fc72d2267e  ops/timeweb/upstream-disposition.py
          3655e79c515544934bff25f9c85c46b3b5d26b58eaed1e30afbd19977d2c1273  ops/timeweb/test-upstream-disposition.py
          8128ccad4b8e8d1b5031f561477e5516e968770056b75e3f8d0751cb38edd7c3  ops/timeweb/scan-upstream-media.py
          c4a35c5b13730316bc92c8f1b1ccf1d1b54c1cbaa15718790cb5603a07aec4a8  ops/timeweb/test-scan-upstream-media.py
          SHA256
          PYTHONDONTWRITEBYTECODE=1 python3 ops/timeweb/test-upstream-disposition.py
          env -i PATH="$PATH" python3 ops/timeweb/test-application-caller.py
          python3 - <<'PY'
          import importlib.util, os, re
          for name in ('APPROVED_APP_COMMIT', 'APPROVED_BASE_COMMIT', 'APPROVED_MERGE_COMMIT', 'APPROVED_IMAGE_CONTROL_COMMIT'):
              assert re.fullmatch(r'[a-f0-9]{40}', os.environ[name]), name
          for name in ('APPROVED_HEAD_RUN', 'APPROVED_MERGE_RUN', 'APPROVED_IMAGE_RUN', 'APPROVED_IMAGE_ARTIFACT_ID'):
              assert re.fullmatch(r'[1-9][0-9]{0,19}', os.environ[name]), name
          for name in ('APPROVED_IMAGE_WORKFLOW_SHA256', 'APPROVED_IMAGE_ARTIFACT_SHA256'):
              assert re.fullmatch(r'[a-f0-9]{64}', os.environ[name]), name
          spec = importlib.util.spec_from_file_location('stage', 'ops/timeweb/prepare-database-host.py')
          stage = importlib.util.module_from_spec(spec); spec.loader.exec_module(stage)
          stage.metadata(os.environ)
          PY

      - name: Verify immutable qualified image evidence and current source gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/verify-launch-provenance.py

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          path: Kinetra
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact application checkout and offline database runner tests
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
        run: |
          set -euo pipefail
          test "$(git -C "$APP_CHECKOUT" rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          git -C "$APP_CHECKOUT" diff --exit-code
          (cd "$APP_CHECKOUT" && sha256sum --check --quiet MANIFEST.sha256)
          command -v node >/dev/null
          env -i PATH="$PATH" python3 ops/timeweb/test-prepare-database-host.py
          env -i PATH="$PATH" APP_CHECKOUT="$APP_CHECKOUT" python3 ops/timeweb/test-initialize-database-host.py

      - name: Stage exact sources and qualified images on existing server 9069403
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/prepare-database-host.py --stage-new-empty-database-host

      - name: Initialize only the approved new empty PostgreSQL database
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          python3 ops/timeweb/application-caller.py --initialize-database

      - name: Retain complete successful database handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinetra-database-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/database-handoff.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain sanitized database attempt observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinetra-database-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/database-outer.json
            ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/database-outer.observations.jsonl
          if-no-files-found: ignore
          retention-days: 14

# Host helpers enforce fixed server identity, pinned SSH, invocation-owned key
# cleanup, read-only approved inputs, preserved partial data and no app startup.
# A failed/partial stage or initialization needs a diagnosed correction/resume;
# this first-initialization workflow must never clear state or blindly rerun.
