# DORMANT: fill immutable successful image/local-run evidence before copying
# to .github/workflows/timeweb-https-activation.yml. No trigger at this path.
name: Accept prepared HTTPS on existing Kinetra host
'on':
  push:
    branches:
    - ops/timeweb-hourly-preflight-20260909
    paths:
    - .github/workflows/timeweb-https-activation.yml
permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
env:
  ACTIVATE_PREPARED_HTTPS: REVIEW_REQUIRED
  APPROVED_APP_COMMIT: REVIEW_REQUIRED
  APPROVED_BASE_COMMIT: REVIEW_REQUIRED
  APPROVED_MERGE_COMMIT: REVIEW_REQUIRED
  APPROVED_HEAD_RUN: REVIEW_REQUIRED
  APPROVED_MERGE_RUN: REVIEW_REQUIRED
  APPROVED_IMAGE_RUN: REVIEW_REQUIRED
  APPROVED_IMAGE_CONTROL_COMMIT: REVIEW_REQUIRED
  APPROVED_IMAGE_WORKFLOW_SHA256: REVIEW_REQUIRED
  APPROVED_IMAGE_ARTIFACT_ID: REVIEW_REQUIRED
  APPROVED_IMAGE_ARTIFACT_SHA256: REVIEW_REQUIRED
  NODE_IMAGE: REVIEW_REQUIRED
  NGINX_IMAGE: REVIEW_REQUIRED
  BACKEND_IMAGE: REVIEW_REQUIRED
  FRONTEND_IMAGE: REVIEW_REQUIRED
  POSTGRES_IMAGE: REVIEW_REQUIRED
  APPROVED_LOCAL_RUN: REVIEW_REQUIRED
  APPROVED_LOCAL_CONTROL_COMMIT: REVIEW_REQUIRED
  APPROVED_LOCAL_WORKFLOW_SHA256: REVIEW_REQUIRED
  APPROVED_LOCAL_ARTIFACT_ID: REVIEW_REQUIRED
  APPROVED_LOCAL_ARTIFACT_SHA256: REVIEW_REQUIRED
  ROOT_SUPPLIED_SERVER_ID: '9069403'
  ROOT_SUPPLIED_SERVER_IP: 80.68.156.131
  APP_CHECKOUT: ${{ github.workspace }}/Kinetra
jobs:
  activate-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Verify reviewed HTTPS caller and offline ownership contracts
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        sha256sum --check --strict <<'SHA256'
        1d93f744398488e9f319e7d558a7c1d3e2c9b782d36d7b430fd3ec1709b51eaa  ops/timeweb/start-application-host.py
        16c9ed2fc47534f86f35e4aa215d824ffbec84fd3c684d5d02157a7e944322c4  ops/timeweb/activate-application-host.py
        041f415dedf6b0b6922484281926c8c98c87828506dcb2e1ac6fb324b00b05bb  ops/timeweb/initialize-database-host.py
        4621b1c0153ab56ae535e245fdb2de4ef2aff4a30ba5b592343a26795f0655ae  ops/timeweb/prepare-database-host.py
        a19aca3ea953feecdcb9be6e9dcabdfc8b0e2b4f3938184391cdfb2ff3e87c9e  ops/timeweb/bootstrap-server.py
        567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
        f549bdda5c325ce4d36a2be239bb6458f79f5d011d3e5ec61e9158388377377a  ops/timeweb/prepare-api-host.py
        fa721ac338095fa2f087fb7de5780a875cbc616fd384490a6fd84ada7e0735cd  ops/timeweb/activate-local-application-host.py
        3b4f5b88f2ebebb34acd84cf6098d7ac4b587c2cf4eea708ceef4a9f482b88a5  ops/timeweb/activate-https-host.py
        a23d52b21f7c638f757a723048ee632d37e8f217ae796f97dd92ec3bbb990e2d  ops/timeweb/prepare-caddy.sh
        988e2dabf64cf0c4772d81a16f5481043cad027374c27a1d4939d3343992cbe6  ops/timeweb/https-caller.py
        220b37d1ac4ecd8745b10695abdbaaaa94877ef70598f83bfe1496023eab6518  ops/timeweb/test-https-caller.py
        177b05d5e67f772a36976705a18114971dce9b860f88fcea98cec88f3eab792b  ops/timeweb/application-caller.py
        61fc0550edbc533938b1850ad17aa6779c1d2fa7122db08296748acfe43924ea  ops/timeweb/verify-launch-provenance.py
        ba9d7f7d4a5475de9a4401be60694bcbeab1e62308d2f304454360fc72d2267e  ops/timeweb/upstream-disposition.py
        dcfeda041b41481494de1ae884b3d90c58c54a9bc612c8f1d1224063ae232d71  ops/timeweb/test-activate-local-application-host.py
        e2a3a89ae53b94558bf21e7e261c3eed9e862b5bca20c838ae06d90db1def135  ops/timeweb/test-activate-https-host.py
        SHA256
        sudo env -i PATH="$PATH" python3 -B - <<'PY'
        import os,pathlib,shutil,subprocess,tempfile
        with tempfile.TemporaryDirectory(prefix='kinetra-https-check-',dir='/root') as folder:
            target=pathlib.Path(folder)/'timeweb'
            shutil.copytree('ops/timeweb',target,ignore=shutil.ignore_patterns('__pycache__'))
            for name in ('test-activate-https-host.py','test-https-caller.py'):
                subprocess.run(['python3','-B',str(target/name)],env={'PATH':os.environ['PATH']},check=True,timeout=120)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.APPROVED_APP_COMMIT }}
        path: Kinetra
        persist-credentials: false
        fetch-depth: 1
    - name: Verify exact application checkout
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C "$APP_CHECKOUT" rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
        git -C "$APP_CHECKOUT" diff --exit-code
        (cd "$APP_CHECKOUT" && sha256sum --check --quiet MANIFEST.sha256)
    - name: Authenticate current images and complete successful local application handoff
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 -B ops/timeweb/https-caller.py --authenticate-local
    - name: Activate only prepared HTTPS on the existing server
      shell: bash
      env:
        TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      run: |
        set -euo pipefail
        python3 -B ops/timeweb/https-caller.py --activate-https
    - name: Retain accepted HTTPS handoff
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: kinetra-https-handoff-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/kinetra-https-caller-${{ github.run_id }}-1/accepted-https-handoff.json
        if-no-files-found: error
        retention-days: 14
    - name: Retain sanitized HTTPS attempt observations
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: kinetra-https-attempt-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/kinetra-https-caller-${{ github.run_id }}-1/https-outer.observations.jsonl
        if-no-files-found: ignore
        retention-days: 14
