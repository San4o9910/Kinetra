name: Export Kinetra source

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/t04-profile-survey'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: kinetra-t04-source
          path: |
            .
            !.git/**
            !node_modules/**
            !**/dist/**
          include-hidden-files: true
          retention-days: 1
