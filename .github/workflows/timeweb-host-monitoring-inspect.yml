name: Inspect existing Timeweb host monitoring
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths:
      - .github/workflows/timeweb-host-monitoring-inspect.yml
      - ops/timeweb/inspect-host-monitoring.py
      - ops/timeweb/test-inspect-host-monitoring.py
permissions:
  contents: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'San4o9910/Kinetra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed read-only inspection source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          sha256sum --check --strict <<'SHA256'
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          3ffc667a66330c323836d1335e78f92940d6ebdc1877cf66048265d774bb3086  ops/timeweb/inspect-host-monitoring.py
          75b7f891f1ff9bab93458bb3f8090ca008886bdbd9a414e8441e80ebb79f43cf  ops/timeweb/test-inspect-host-monitoring.py
          SHA256
          sudo --non-interactive env -i PATH=/usr/bin:/bin python3 ops/timeweb/test-inspect-host-monitoring.py
      - name: Identify port 10050 owner and nonsecret monitoring configuration
        shell: bash
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/inspect-host-monitoring.py --inspect-existing-host-monitoring
