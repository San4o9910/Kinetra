name: Verify isolated trainer workflow stability
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-browser-input-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6f036dccd0bd4513f9ca8b2fd712069758ccb335
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact candidate and install pinned dependencies
        run: |
          test "$(git rev-parse HEAD)" = 6f036dccd0bd4513f9ca8b2fd712069758ccb335
          sha256sum --check --quiet MANIFEST.sha256
          npm ci
      - name: Install the same media decoder as CI
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify trainer-student chat, nutrition templates, photos and packages
        env:
          VITE_API_URL: https://api.ci.kinetra.test
          KINETRA_CAPTURE_PREVIEW_LOG: 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-frontend-browser.mjs');s=p.read_text()
          for call in ['await runBrowserScenario();','await runT12BrowserScenario();','await runTrainerApplicationBrowserScenario();']:
              assert s.count(call)==1;s=s.replace(call,'// Other suites remain mandatory in release CI.')
          p.write_text(s)
          p=Path('scripts/test-nutrition-coaching-browser.mjs');s=p.read_text()
          needle="    assert.ok(\n      metrics.composerBottom"
          assert needle in s
          diagnostic="""    console.log('KINETRA_CHAT_LAYOUT_DIAGNOSTIC='+JSON.stringify({role, nodes:await context.cdp.evaluate(`(() => {let n=document.querySelector('[data-testid=chat-composer]');const a=[];while(n){const r=n.getBoundingClientRect(),s=getComputedStyle(n);a.push({class:n.className,top:r.top,bottom:r.bottom,height:s.height,minHeight:s.minHeight,padding:s.padding,display:s.display,gridRows:s.gridTemplateRows,overflow:s.overflow});n=n.parentElement;}return a;})()`)}));
              if(metrics.composerBottom>metrics.navTop+1) await capture(context, 'chat-'+role);
          """
          s=s.replace(needle,diagnostic+needle);p.write_text(s)
          PY
          for attempt in 1; do
            node scripts/test-frontend-browser.mjs
          done
      - name: Retain nutrition and trainer previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lesson-sharing-preview
          path: artifacts/lesson-sharing/
          if-no-files-found: ignore
