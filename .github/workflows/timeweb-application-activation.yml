# DORMANT REVIEW COPY: this path is not a GitHub Actions workflow.
# Fill REVIEW_REQUIRED from actual green current CI/image/database evidence;
# review this caller before publishing as .github/workflows/timeweb-application-activation.yml.
# Only API environment preparation and local application startup. No HTTPS/boot/jobs.
# Owner approval c124b95ba62ff4a72491622dc92601dab4f89b6d; exact created-backend continuation only.
name: Continue exact preserved Kinetra backend after approved Health fix

on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/timeweb-application-activation.yml]

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read

concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false

env:
  ACTIVATE_LOCAL_APPLICATION: APPROVED
  APPROVED_APP_COMMIT: 73b665065e00a5b375e90f701373b3e0856a0386
  APPROVED_BASE_COMMIT: ea0412a20baa87b7a00c4ce466d204d12fb052cc
  APPROVED_MERGE_COMMIT: 2f5d388dea92ed4994131d0b5e77734189de026c
  APPROVED_HEAD_RUN: '34535162371'
  APPROVED_MERGE_RUN: '34535166746'
  APPROVED_IMAGE_RUN: '34742116241'
  APPROVED_IMAGE_CONTROL_COMMIT: 074db3062f601a4ad12896219cc041d71b6b355f
  APPROVED_IMAGE_WORKFLOW_SHA256: 971b921d5f309b4cc20c6ca552e4df6084d454b749dd11a70fc5676bddd7ad49
  APPROVED_IMAGE_ARTIFACT_ID: '10313848590'
  APPROVED_IMAGE_ARTIFACT_SHA256: 45f567dd7b0085168a90fbb7f30bccbf312e7d4f4584ec254f4e9181323e7b4b
  APPROVED_DATABASE_RUN: '34747344318'
  APPROVED_DATABASE_CONTROL_COMMIT: 05ee5f7f7557ab689e19cf7024e75e813ace2284
  APPROVED_DATABASE_WORKFLOW_SHA256: cb01e5c531dcb5ade89682b97ea776c7d2b33053dddfd9d358b4f7f56ecd7fc0
  APPROVED_DATABASE_ARTIFACT_ID: '10314313956'
  APPROVED_DATABASE_ARTIFACT_SHA256: e789ea40587c5537003348d862b511df80843767144a824952cc06b13ab4f8a2
  NODE_IMAGE: node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
  NGINX_IMAGE: nginxinc/nginx-unprivileged@sha256:3a4485bf084957d56674ee22db07d77d5a281418815c5852827419d6d629d440
  BACKEND_IMAGE: ghcr.io/san4o9910/kinetra-backend@sha256:9138a6408442b847ca771690053870880cee831769919aaf2a2dc858d52e8362
  FRONTEND_IMAGE: ghcr.io/san4o9910/kinetra-frontend@sha256:da47e7f576cfb3892b9078e8463cdad855081e032d51645639794736c1098ff2
  POSTGRES_IMAGE: postgres:17-bookworm@sha256:7bade6d532592ca8ce7ee32def7399dad2607c4ea5583839fc4352a095a11ea6
  ROOT_SUPPLIED_SERVER_ID: '9069403'
  ROOT_SUPPLIED_SERVER_IP: 80.68.156.131

jobs:
  activate-local-application:
    runs-on: ubuntu-24.04
    # Includes separate 30min API preparation and 60min local wrapper bounds,
    # authenticated evidence checks, and graceful cleanup/artifact allowance.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed caller and exact control checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = San4o9910/Kinetra
          test "$GITHUB_REF" = refs/heads/ops/timeweb-hourly-preflight-20260909
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$ACTIVATE_LOCAL_APPLICATION" = APPROVED
          sha256sum --check --strict <<'SHA256'
          a8cbec10bf8267d18dbda507817b39b36511c2edbd5a7dd1a2889d062943dfec  ops/timeweb/application-caller.py
          61fc0550edbc533938b1850ad17aa6779c1d2fa7122db08296748acfe43924ea  ops/timeweb/verify-launch-provenance.py
          444528e29fa1b280a78989727911a9f6c5025f285a30bed5af0f31fc0ea396c8  ops/timeweb/test-application-caller.py
          ba9d7f7d4a5475de9a4401be60694bcbeab1e62308d2f304454360fc72d2267e  ops/timeweb/upstream-disposition.py
          85f25de920ccffb1878a56b5be6132c0d3ab99a0d21125112575ba8efffd3c82  ops/timeweb/test-upstream-disposition.py
          42d0618f56c543b91778bedac8b87c6b5fecd332b79e9e7e21a9af14b85b3e63  ops/timeweb/scan-upstream-media.py
          c4a35c5b13730316bc92c8f1b1ccf1d1b54c1cbaa15718790cb5603a07aec4a8  ops/timeweb/test-scan-upstream-media.py
          8326af893a6b25d65394841584f3d9b12b264868a592addc7c1f4cdff42128ae  ops/timeweb/recover-api-candidate-host.py
          0a1ec78c18632cb03630902c27060a930ec038086711614cac59601b236fdac2  ops/timeweb/recover-api-preparation.py
          63afde60c658cae65837516b84e6f5583978d96e33dba8558fb75233d1dae547  ops/timeweb/recovery-caller.py
          d1aa5e4c1e488d6fe8437bcbbb035c6c2750d1c7163e30fc39bd8dc60f70d42d  ops/timeweb/test-recover-api-candidate.py
          9e40c2c3de2bea16147df4d0af0ffde7912c5bfe7d87914a51aae08049b29240  ops/timeweb/authenticate-preserved-api.py
          2658c9b04bfdc076b7cf509570e9518b65f10ec6e0b6df960c3810a3a17a6de7  ops/timeweb/test-preserved-api-auth.py
          650c761d5293bd9871e54b23971b758e6936a6dc0040a205afd9fe6df22d3a01  ops/timeweb/api-resume-evidence-20260913.json
          dcfeda041b41481494de1ae884b3d90c58c54a9bc612c8f1d1224063ae232d71  ops/timeweb/test-activate-local-application-host.py
          7e288a7066cce17be60e6cf8bbd49631dc1cd943e694c2fa67cdb003bea402bd  ops/timeweb/resume-created-application-host.py
          21380c6e56b078c4a1847fe595ecb2709363b88d9612c2e8c5f34305bf37777c  ops/timeweb/resume-local-application-host.py
          4cd08ae4a25ecad494be01181eb36efccc0dae6ac520440eef717c12842a7b1d  ops/timeweb/resume-application-caller.py
          7087e81f96f91243532ec117b1c69a4e241789966e701c9d840ca795faf06a24  ops/timeweb/authenticate-created-backend.py
          85eb4e5dd0e06639f521962fbd7ff0ca466f37899c8f05ad35435511c415b71e  ops/timeweb/test-resume-created-backend.py
          6a0ddc54997eb134f0f9f2a570bf2e36c677baa7a7191eb5c072400d8722fbf0  ops/timeweb/created-backend-inspection-20260913.json
          ab621a94e6c697c35464c72d75532ab3beaa3645b059f258d035bf55802d35ee  ops/timeweb/test-start-health-query-proposal.py
          c83c167618b97c01a543e70c9af218969264106432d32437e0695fc977ab471d  ops/timeweb/start-health-query-fix-20260913.patch
          SHA256
          sudo env -i PATH="$PATH" python3 -B ops/timeweb/test-resume-created-backend.py
          env -i PATH="$PATH" python3 -B ops/timeweb/test-start-health-query-proposal.py
          # Model guest fixture ownership independently from the unprivileged runner checkout.
          env -i PATH="$PATH" python3 -B ops/timeweb/test-preserved-api-auth.py
          env -i PATH="$PATH" python3 -B ops/timeweb/test-activate-local-application-host.py
          PYTHONDONTWRITEBYTECODE=1 python3 ops/timeweb/test-upstream-disposition.py
          env -i PATH="$PATH" python3 ops/timeweb/test-application-caller.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APPROVED_APP_COMMIT }}
          path: Kinetra
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact application checkout
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
        run: |
          set -euo pipefail
          test "$(git -C "$APP_CHECKOUT" rev-parse HEAD)" = "$APPROVED_APP_COMMIT"
          git -C "$APP_CHECKOUT" diff --exit-code
          (cd "$APP_CHECKOUT" && sha256sum --check --quiet MANIFEST.sha256)
      - name: Authenticate current source images and successful database handoff
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/application-caller.py --authenticate-database
      - name: Authenticate preserved API and exact failed startup with fresh backend inspection
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B ops/timeweb/authenticate-created-backend.py --authenticate-created-backend
      - name: Recheck current source images and database before local startup
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/application-caller.py --recheck-provenance
      - name: Start and accept only local backend and frontend
        shell: bash
        env:
          APP_CHECKOUT: ${{ github.workspace }}/Kinetra
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          python3 -B ops/timeweb/resume-application-caller.py --resume-exact-created-backend
      - name: Retain sanitized accepted local handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinetra-local-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/accepted-local-handoff.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain sanitized attempt observations for reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinetra-local-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/api-outer.json
            ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/local-outer.json
            ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/api-outer.observations.jsonl
            ${{ runner.temp }}/kinetra-launch-caller-${{ github.run_id }}-1/local-outer.observations.jsonl
          if-no-files-found: ignore
          retention-days: 14

# Failure is not an instruction to repeat preparation/start. Private local
# failure records and the durable host attempt remain for state-specific review.
# Caddy, HTTP certificate requests, boot policy and production writes are excluded.
