name: Kinetra CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kinetra_test
          POSTGRES_USER: kinetra
          POSTGRES_PASSWORD: kinetra_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinetra -d kinetra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kinetra:kinetra_test_ci@localhost:5432/kinetra_test
      JWT_ACCESS_SECRET: ci-test-access-secret-not-real-32-bytes
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real-32-bytes
      NODE_ENV: test
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
      YUKASSA_SHOP_ID: ci-test-shop-not-real
      YUKASSA_SECRET_KEY: ci-test-secret-not-real
      YUKASSA_RETURN_URL: http://localhost:5173/payment/success
      YUKASSA_REQUEST_TIMEOUT_MS: '10000'
      CI: 'true'
      KINETRA_REQUIRE_POSTGRES_TEST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Seed content model
        run: npm run db:seed

      - name: Verify idempotent seed
        run: npm run db:seed

      - name: Verify content model
        run: npm run db:verify-content

      - name: Confirm PostgreSQL integration test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          echo 'KINETRA_T04_POSTGRES_PREREQUISITES=PASS'

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test 2>&1 | tee /tmp/kinetra-test.log
          grep -F 'KINETRA_T04_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T04_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T05_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T05_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T06_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T06_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T06_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T07_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T07_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T07_PLAYER_TAB_HISTORY=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T07_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T08_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T08_CARD_NAVIGATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T08_COMPLETION_STATE=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T08_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T09_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T09_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T09_PROGRESS_CONTENT=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T09_GOAL_UPDATE=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T09_WEEKLY_METRICS=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T09_CHARTS=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T09_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_SETTINGS_CONTENT=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_NOTIFICATIONS=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_THEME_MODES=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_LOGOUT=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_ACCOUNT_DELETION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T10_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_YOOKASSA_CLIENT=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_WEBHOOK_AUTH=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_WEBHOOK_IDEMPOTENCY=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_RENEWAL_IDEMPOTENCY=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_PAYMENT_FLOW=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_PAYWALL=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_SETTINGS_SUBSCRIPTION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T11_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          echo 'KINETRA_T04_TEST_SUITE=PASS'
          echo 'KINETRA_T05_TEST_SUITE=PASS'
          echo 'KINETRA_T06_TEST_SUITE=PASS'
          echo 'KINETRA_T07_TEST_SUITE=PASS'
          echo 'KINETRA_T08_TEST_SUITE=PASS'
          echo 'KINETRA_T09_TEST_SUITE=PASS'
          echo 'KINETRA_T10_TEST_SUITE=PASS'
          echo 'KINETRA_T11_TEST_SUITE=PASS'

      - name: Verify browser profile cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          leftovers="$(find /tmp -maxdepth 1 -type d -name 'kinetra-browser-*' -print)"
          if [[ -n "$leftovers" ]]; then
            echo 'Browser profile directories were not removed:' >&2
            echo "$leftovers" >&2
            exit 1
          fi
          echo 'KINETRA_BROWSER_TMP_CLEANUP=PASS'

  structure:
    name: Structure Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verify project structure
        run: node scripts/verify-project.mjs

      - name: Verify source manifest
        shell: bash
        run: |
          diff -u \
            <(git ls-files | sed '/^MANIFEST\.sha256$/d' | sed 's#^#./#' | LC_ALL=C sort) \
            <(awk '{ print $2 }' MANIFEST.sha256 | LC_ALL=C sort)
          sha256sum -c MANIFEST.sha256
