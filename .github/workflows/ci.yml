          grep -F 'KINETRA_T12_PHOTO_SECURITY=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_CLIENT_UI=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_TRAINER_ADMIN=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_T13_COEXISTENCE=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_UPLOAD_AUTHORIZATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_S3_MULTIPART=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_VIDEO_VERIFICATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_TRAINER_UI=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_UPLOAD_LIFECYCLE=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_REPLACE_UNPUBLISH=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_T07_T12_T13_COEXISTENCE=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T14_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_TRAINER_VERIFICATION_MIGRATION_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_REGISTRATION_ROLES_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_SQLSTATE_42804_REGRESSION_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_REGISTRATION_PROFILE_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_TRAINER_VERIFICATION_REVIEWER_CLI_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_TRAINER_VERIFICATION_LIFECYCLE_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_TRAINER_VERIFICATION_APPROVAL_GUARDS_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_TRAINER_VERIFICATION_AUDIT_CASCADE_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_TRAINER_VERIFICATION_LATEST_REQUEST_POSTGRES17=PASS' /tmp/kinetra-test.log
          grep -E '^(# |ℹ )?KINETRA_PRODUCTION_CONTENT_SEED_POSTGRES_TEST=PASS$' /tmp/kinetra-test.log
          grep -E '^(# |ℹ )?KINETRA_FREE_BETA_POSTGRES17=PASS$' /tmp/kinetra-test.log
          grep -E '^KINETRA_PAYMENTS_DISABLED_BROWSER_E2E=PASS$' /tmp/kinetra-test.log
          grep -E '^KINETRA_FREE_BETA_BROWSER_E2E=PASS$' /tmp/kinetra-test.log
          node --input-type=module <<'JS_SUITE_EVIDENCE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const log = readFileSync('/tmp/kinetra-test.log', 'utf8');
          const summary = {};
          for (const field of ['tests', 'pass', 'fail', 'cancelled', 'skipped', 'todo']) {
            const values = [...log.matchAll(new RegExp('^(?:#|ℹ) ' + field + ' ([0-9]+)$', 'gm'))]
              .map((match) => Number(match[1]));
            assert.equal(values.length, 2, `Both completed suite summaries are required: ${field}`);
            if (field === 'tests' || field === 'pass') {
              assert.ok(values.every((value) => value > 0), `Empty suite: ${field}`);
            } else {
              assert.deepEqual(values, [0, 0], `Failed, skipped or incomplete suite: ${field}`);
            }
            summary[field] = values;
          }
          assert.deepEqual(summary.tests, summary.pass);
          console.log('KINETRA_COMPLETE_TEST_SUITES_NO_SKIPS=PASS');
          JS_SUITE_EVIDENCE
          echo 'KINETRA_T04_TEST_SUITE=PASS'
          echo 'KINETRA_T05_TEST_SUITE=PASS'
          echo 'KINETRA_T06_TEST_SUITE=PASS'
          echo 'KINETRA_T07_TEST_SUITE=PASS'
          echo 'KINETRA_T08_TEST_SUITE=PASS'
          echo 'KINETRA_T09_TEST_SUITE=PASS'
          echo 'KINETRA_T10_TEST_SUITE=PASS'
          echo 'KINETRA_T11_TEST_SUITE=PASS'
          echo 'KINETRA_T13_TEST_SUITE=PASS'
          echo 'KINETRA_T12_TEST_SUITE=PASS'
