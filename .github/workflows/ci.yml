          grep -F 'KINETRA_T11_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_WEBPUSH_SENDER=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_SCHEDULER=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_SERVICE_WORKER=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_PERMISSION_LIFECYCLE=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_SETTINGS_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T13_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_SOCKET_AUTHORIZATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_MESSAGE_DELIVERY=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T12_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
