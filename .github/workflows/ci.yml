  structure:
    name: Structure Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          semantics='push-head'
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            if [[ "$checkout_sha" == "$EXPECTED_HEAD_SHA" ]]; then
              semantics='pull-request-head'
            else
              test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
              test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
              semantics='pull-request-merge'
            fi
          else
            test "$checkout_sha" = "$GITHUB_SHA"
          fi
          {
            echo "Checkout semantics: $semantics"
            echo "Checkout SHA: $checkout_sha"
            echo "Expected base SHA: ${EXPECTED_BASE_SHA:-n/a}"
            echo "Expected head SHA: ${EXPECTED_HEAD_SHA:-n/a}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "KINETRA_CI_CHECKOUT_SEMANTICS=$semantics"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verify project structure
        run: node scripts/verify-project.mjs

      - name: Verify source manifest
        shell: bash
        run: |
          diff -u \
            <(git ls-files | sed '/^MANIFEST\.sha256$/d' | sed 's#^#./#' | LC_ALL=C sort) \
            <(awk '{ print $2 }' MANIFEST.sha256 | LC_ALL=C sort)
          sha256sum -c MANIFEST.sha256
