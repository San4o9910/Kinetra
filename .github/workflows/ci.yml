name: Kinetra CI

on:
  push:
    branches:
      [
        main,
        develop,
        fix/t12-merge-readiness,
        feature/t14-video-upload-s3,
        feature/registration-roles-verification,
        feature/onboarding-exploration-mode,
      ]
  pull_request:
    branches: [main, develop, feature/t12-trainer-chat, feature/registration-roles-verification]

env:
  NODE_VERSION: '22'
  VITE_API_URL: https://api.ci.kinetra.test

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          semantics='push-head'
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            if [[ "$checkout_sha" == "$EXPECTED_HEAD_SHA" ]]; then
              semantics='pull-request-head'
            else
              test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
              test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
              semantics='pull-request-merge'
            fi
          else
            test "$checkout_sha" = "$GITHUB_SHA"
          fi
          {
            echo "Checkout semantics: $semantics"
            echo "Checkout SHA: $checkout_sha"
            echo "Expected base SHA: ${EXPECTED_BASE_SHA:-n/a}"
            echo "Expected head SHA: ${EXPECTED_HEAD_SHA:-n/a}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "KINETRA_CI_CHECKOUT_SEMANTICS=$semantics"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:changed

      - name: Verify deployment configuration and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          node --test ops/test-production-env.mjs
          for script in ops/*.sh; do bash -n "$script"; done

      - name: Build
        run: npm run build

  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kinetra_test
          POSTGRES_USER: kinetra
          POSTGRES_PASSWORD: kinetra_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinetra -d kinetra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kinetra:kinetra_test_ci@localhost:5432/kinetra_test
      JWT_ACCESS_SECRET: ci-test-access-secret-not-real-32-bytes
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real-32-bytes
      NODE_ENV: test
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
      YUKASSA_SHOP_ID: ci-test-shop-not-real
      YUKASSA_SECRET_KEY: ci-test-secret-not-real
      YUKASSA_RETURN_URL: http://localhost:5173/payment/success
      YUKASSA_REQUEST_TIMEOUT_MS: '10000'
      VAPID_PUBLIC_KEY: BG_wO5SSQc4drdQ1GeaWDgqFtBppoFwygQOqK84VlMoWPE91OlW_AdxT9sCwx-7ni0DG_30lqW4igrmJzvccFEo
      VAPID_PRIVATE_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      VAPID_SUBJECT: mailto:ci@kinetra.test
      CHAT_ENABLED: 'true'
      CHAT_PHOTO_UPLOADS_ENABLED: 'false'
      CHAT_PHOTO_UPLOAD_IDLE_TIMEOUT_SECONDS: '15'
      CHAT_PHOTO_UPLOAD_TOTAL_TIMEOUT_SECONDS: '120'
      CHAT_MEDIA_URL_TTL_SECONDS: '300'
      CI: 'true'
      KINETRA_REQUIRE_POSTGRES_TEST: 'true'
      KINETRA_REQUIRE_S3_TEST: 'true'
      KINETRA_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      KINETRA_S3_TEST_ACCESS_KEY: kinetra-test-access
      KINETRA_S3_TEST_SECRET_KEY: kinetra-test-secret-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          semantics='push-head'
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            if [[ "$checkout_sha" == "$EXPECTED_HEAD_SHA" ]]; then
              semantics='pull-request-head'
            else
              test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
              test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
              semantics='pull-request-merge'
            fi
          else
            test "$checkout_sha" = "$GITHUB_SHA"
          fi
          {
            echo "Checkout semantics: $semantics"
            echo "Checkout SHA: $checkout_sha"
            echo "Expected base SHA: ${EXPECTED_BASE_SHA:-n/a}"
            echo "Expected head SHA: ${EXPECTED_HEAD_SHA:-n/a}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "KINETRA_CI_CHECKOUT_SEMANTICS=$semantics"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install real media decoders
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg imagemagick
          identify -version
          convert -version
          ffmpeg -version
          ffprobe -version

      - name: Start pinned private S3-compatible fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name kinetra-t14-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$KINETRA_S3_TEST_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$KINETRA_S3_TEST_SECRET_KEY" \
            --env 'MINIO_KMS_SECRET_KEY=kinetra-t14-ci-key:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' \
            minio/minio:RELEASE.2025-06-13T11-33-47Z \
            server /data --address ':9000'
          ready='false'
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready='true'
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 'true' ]]; then
            docker logs kinetra-t14-minio
            exit 1
          fi

      - name: Run migrations
        run: npm run db:migrate

      - name: Verify idempotent migrations
        run: npm run db:migrate

      - name: Seed content model
        run: npm run db:seed

      - name: Verify idempotent seed
        run: npm run db:seed

      - name: Verify content model
        run: npm run db:verify-content

      - name: Confirm PostgreSQL integration test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          echo 'KINETRA_T04_POSTGRES_PREREQUISITES=PASS'

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test 2>&1 | tee /tmp/kinetra-test.log
          grep -Eq '^(#|ℹ) tests [1-9][0-9]*$' /tmp/kinetra-test.log
          if grep -Eq '^(#|ℹ) (fail|cancelled|skipped) [1-9][0-9]*$' /tmp/kinetra-test.log; then
            echo 'A test failed or was skipped; release validation is blocked.' >&2
            exit 1
          fi
          grep -F 'KINETRA_T04_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T04_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T05_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T05_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T06_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T06_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T06_BROWSER_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T07_BACKEND_E2E=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T07_POSTGRES_INTEGRATION=PASS' /tmp/kinetra-test.log
          grep -F 'KINETRA_T07_PLAYER_TAB_HISTORY=PASS' /tmp/kinetra-test.log
