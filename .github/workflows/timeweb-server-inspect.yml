name: Inspect existing hourly Kinetra server
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths:
      - .github/workflows/timeweb-server-inspect.yml
      - ops/timeweb/inspect-server.py
permissions:
  contents: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'San4o9910/Kinetra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed checkout and inspection source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          sha256sum --check --strict <<'SHA256'
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          SHA256
      - name: Inspect confirmed server using temporary SSH access
        shell: bash
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/inspect-server.py --inspect-existing-server
