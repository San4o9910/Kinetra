name: Diagnose current application availability
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-availability.yml]
permissions:
  contents: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact reviewed read-only inspection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check --strict <<'SHA256'
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          fb533928b82753e65cd77413eddd249e203b6c67fff548414629f3353e5b2d68  ops/timeweb/availability-caller.py
          c1179fab18c504f174556829348461e61c5889ba2ca94ff2432e1734e190be7b  ops/timeweb/availability-host-inspect.py
          SHA256
      - name: Inspect existing application, migration ledger and backup capacity
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 -B ops/timeweb/availability-caller.py --inspect-availability
      - name: Check public HTTPS from an external runner
        if: always()
        run: |
          python3 - <<'PY_HTTP'
          import json,urllib.request,urllib.error
          for path in ('/', '/health', '/api/v1/me'):
            try:
              with urllib.request.urlopen('https://80.68.156.131'+path,timeout=20) as response: code=response.status
            except urllib.error.HTTPError as error: code=error.code
            except Exception as error: code=type(error).__name__+':'+type(getattr(error,'reason',None)).__name__+':'+str(getattr(getattr(error,'reason',None),'errno',None))
            print('KINETRA_PUBLIC='+json.dumps({'path':path,'status':code}))
          PY_HTTP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaching-host-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/kinetra-availability.json
          if-no-files-found: error
          retention-days: 14
