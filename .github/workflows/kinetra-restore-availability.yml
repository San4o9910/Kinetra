name: Restore database and HTTPS after reboot
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-restore-availability.yml]
permissions:
  contents: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify fixed release and bounded recovery
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check --strict <<'SHA256'
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          ae2abb6a43dd4c588c2a9e61e9c3232e6ec2c3f884259184ee674c59bb7e94ca  ops/timeweb/restore-availability-caller.py
          46fd58d06503e4129310a0fd1537daef858c5e274dfa28338134849c32419916  ops/timeweb/restore-availability-host.py
          SHA256
      - name: Start existing database and HTTPS with persistent boot policies
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 -B ops/timeweb/restore-availability-caller.py --restore-availability
      - name: Check public HTTPS from an external runner
        if: always()
        run: |
          python3 - <<'PY_HTTP'
          import json,urllib.request,urllib.error
          for path in ('/', '/health', '/api/v1/me'):
            try:
              with urllib.request.urlopen('https://80.68.156.131'+path,timeout=20) as response: code=response.status
            except urllib.error.HTTPError as error: code=error.code
            except Exception as error: code=type(error).__name__+':'+type(getattr(error,'reason',None)).__name__+':'+str(getattr(getattr(error,'reason',None),'errno',None))
            print('KINETRA_PUBLIC='+json.dumps({'path':path,'status':code}))
            assert code == (401 if path=='/api/v1/me' else 200)
          PY_HTTP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coaching-host-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/kinetra-availability-repair.json
          if-no-files-found: error
          retention-days: 14
