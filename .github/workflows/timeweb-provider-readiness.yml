# Refresh Yandex SMTP presence after owner added the two repository secrets.
name: Kinetra provider configuration presence
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/timeweb-provider-readiness.yml]
permissions: {}
jobs:
  inspect-presence:
    if: github.repository == 'San4o9910/Kinetra'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report only presence of required provider settings
        env:
          HAVE_SMTP_USERNAME: ${{ secrets.AUTH_TOKEN_DELIVERY_SMTP_USERNAME != '' }}
          HAVE_SMTP_PASSWORD: ${{ secrets.AUTH_TOKEN_DELIVERY_SMTP_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PRESENCE'
          import os,json
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          keys=['HAVE_SMTP_USERNAME','HAVE_SMTP_PASSWORD']
          assert all(os.environ[k] in ['true','false'] for k in keys)
          print('KINETRA_PROVIDER_PRESENCE='+json.dumps({k:os.environ[k]=='true' for k in keys},sort_keys=True))
          print('KINETRA_PROVIDER_CHECK=SECRET_PRESENCE_ONLY_NOT_PROVIDER_VALIDATION')
          print('KINETRA_PAYMENT_CONFIGURATION=DEFERRED_NOT_REQUIRED')
          PY_PRESENCE
