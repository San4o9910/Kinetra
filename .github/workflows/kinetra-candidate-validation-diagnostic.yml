name: Reconcile actual stopped-container continuation result
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-candidate-validation-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the exact old inspection to remain unstarted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GUARD'
          import json, os, sys, urllib.error, urllib.request
          root = 'https://api.github.com/repos/San4o9910/Kinetra'
          path = '/actions/runs/34749066794'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('unexpected redirect')
          def get(suffix):
              req = urllib.request.Request(root + suffix, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.build_opener(NoRedirect).open(req, timeout=20) as response:
                  assert response.status == 200
                  return json.load(response)
          def verify(run):
              expected = {'id':34749066794, 'head_sha':'096393dae2c1fc977023bd0fccd17b2aa6758ace',
                  'head_branch':'ops/timeweb-hourly-preflight-20260909', 'run_attempt':1,
                  'path':'.github/workflows/kinetra-image-artifact-inspection.yml',
                  'workflow_id':354615253, 'event':'push', 'status':'queued', 'conclusion':None,
                  'created_at':'2026-09-13T09:10:29Z', 'updated_at':'2026-09-13T09:10:29Z'}
              assert all(run.get(key) == value for key, value in expected.items())
              assert run['repository']['id'] == 1339664626
              assert run['repository']['full_name'] == 'San4o9910/Kinetra'
          try:
              verify(get(path))
              for suffix, key in [('/jobs?filter=all&per_page=100','jobs'),
                                  ('/artifacts?per_page=100','artifacts')]:
                  value = get(path + suffix)
                  assert value.get('total_count') == 0 and value.get(key) == []
              verify(get(path))
          except Exception:
              print('KINETRA_REPLACEMENT_GUARD=STOP_REVIEW_OLD_RUN_BEFORE_HOST_ACCESS')
              sys.exit(1)
          print('KINETRA_REPLACEMENT_GUARD=PASS_EXACT_OLD_RUN_QUEUED_WITHOUT_JOBS')
          PY_GUARD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 096393dae2c1fc977023bd0fccd17b2aa6758ace
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect only nonsecret API preparation state on exact host
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          ROOT_SUPPLIED_SERVER_ID: '9069403'
          ROOT_SUPPLIED_SERVER_IP: 80.68.156.131
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict <<'SHA256'
          3ffc667a66330c323836d1335e78f92940d6ebdc1877cf66048265d774bb3086  ops/timeweb/inspect-host-monitoring.py
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          SHA256
          python3 -B - <<'PY_INSPECT'
          import importlib.util, json, os, re, signal, stat, sys

          spec = importlib.util.spec_from_file_location('kinetra_state_inspect', 'ops/timeweb/inspect-host-monitoring.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          guest = r'''
          import fcntl,hashlib,io,json,os,pathlib,re,stat,subprocess,tarfile
          from html.parser import HTMLParser
          stage=pathlib.Path('/srv/kinetra-stage')
          fd=os.open('/run/kinetra-database-stage.lock',os.O_RDONLY|os.O_NOFOLLOW)
          fcntl.flock(fd,fcntl.LOCK_EX|fcntl.LOCK_NB)
          nonce='9128e22668c33a1552f912415c800939'
          files={'original':'application-start-result.json',
              'failed_archive':'application-start-failed-'+nonce+'.json',
              'continuation_attempt':'application-continuation-attempt-'+nonce+'.json',
              'continuation_result':'application-continuation-result-'+nonce+'.json',
              'assets_attempt':'application-assets-attempt-'+nonce+'.json',
              'assets_result':'application-assets-result-'+nonce+'.json'}
          records={}
          for name,filename in files.items():
              p=stage/'evidence'/filename
              if not p.exists():records[name]=None;continue
              info=p.lstat();assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=131072
              raw=p.read_bytes();v=json.loads(raw)
              row={'sha256':hashlib.sha256(raw).hexdigest()}
              for key in ('result','phase','error','nonce','attempt_recorded','attempted_services','start_attempted_services','uncertain_start_services','owned_containers','rollback'):
                  if key in v:row[key]=v[key]
              records[name]=row
          template='{"id":{{json .Id}},"service":{{json (index .Config.Labels "com.docker.compose.service")}},"nonce":{{json (index .Config.Labels "com.kinetra.activation")}},"running":{{json .State.Running}},"status":{{json .State.Status}},"health":{{if (index .State "Health")}}{{json .State.Health.Status}}{{else}}null{{end}},"started":{{json .State.StartedAt}}}'
          rows=[]
          for cid in ('460a447fc441071f595dea383b60487aa707e719511792aefa52a3a0b831962a','c47ad815087ec8f3b310ac59f565babfb03af5b43102f56ac24678ac1c36d206'):
              p=subprocess.run(['/usr/bin/docker','inspect','--type','container','--format',template,cid],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=15,check=True)
              v=json.loads(p.stdout);assert v['id']==cid and v['nonce']==nonce;rows.append(v)
          p=subprocess.run(['/usr/bin/docker','ps','-a','--format','{{.Label "com.docker.compose.service"}}={{.State}}'],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=15,check=True)
          services=p.stdout.splitlines()
          assert len(services)==3 and all(s in {'postgres=running','backend=created','backend=running','backend=exited','frontend=created','frontend=running','frontend=exited'} for s in services)
          result={'schema':1,'result':'PASS_READ_ONLY_INSPECTION','mutations':False,'records':records,'containers':rows,'services':services}
          def read_frontend_file(path):
              p=subprocess.run(['/usr/bin/docker','cp','c47ad815087ec8f3b310ac59f565babfb03af5b43102f56ac24678ac1c36d206:'+path,'-'],
                  stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,check=True)
              assert len(p.stdout)<=131072
              with tarfile.open(fileobj=io.BytesIO(p.stdout),mode='r:*') as t:
                  members=t.getmembers();assert len(members)==1 and members[0].isfile() and members[0].size<=65536
                  return t.extractfile(members[0]).read()
          shell=read_frontend_file('/usr/share/nginx/html/index.html')
          theme=read_frontend_file('/usr/share/nginx/html/theme-init.js')
          config=read_frontend_file('/etc/nginx/nginx.conf')
          class Assets(HTMLParser):
              def __init__(self):super().__init__();self.items=[]
              def handle_starttag(self,tag,attrs):
                  v=dict(attrs)
                  if tag=='script' and v.get('src') is not None:self.items.append({'kind':'script','url':v['src']})
                  if tag=='link' and v.get('rel')=='stylesheet':self.items.append({'kind':'stylesheet','url':v.get('href','')})
          parser=Assets();parser.feed(shell.decode('utf8'))
          assert len(parser.items)<=20 and all(len(x['url'])<=2048 for x in parser.items)
          policy=re.findall(r'add_header Content-Security-Policy "([^"\n]+)" always;',config.decode('utf8'))
          assert len(policy)==1
          result['frontend_assets']={'index_sha256':hashlib.sha256(shell).hexdigest(),
              'theme_sha256':hashlib.sha256(theme).hexdigest(),'nginx_sha256':hashlib.sha256(config).hexdigest(),
              'references':parser.items,'csp':policy[0]}
          os.close(fd)
          print(json.dumps(result,sort_keys=True))
          '''
          def validate(raw):
              v=json.loads(raw)
              assert set(v)=={'schema','result','mutations','records','containers','services','frontend_assets'}
              assert v['schema']==1 and v['result']=='PASS_READ_ONLY_INSPECTION' and v['mutations'] is False
              assert set(v['records'])=={'original','failed_archive','continuation_attempt','continuation_result','assets_attempt','assets_result'}
              for row in v['records'].values():
                  if row is None:continue
                  assert set(row)<={'sha256','result','phase','error','nonce','attempt_recorded','attempted_services','start_attempted_services','uncertain_start_services','owned_containers','rollback'}
                  assert re.fullmatch(r'[a-f0-9]{64}',row['sha256'])
                  for k in ('result','phase','error'):
                      if row.get(k) is not None:assert re.fullmatch(r'[A-Z_]{1,90}',row[k])
                  if 'nonce' in row:assert row['nonce']=='9128e22668c33a1552f912415c800939'
                  for k in ('attempted_services','start_attempted_services','uncertain_start_services'):
                      if k in row:assert isinstance(row[k],list) and len(row[k])<=2 and set(row[k])<={'backend','frontend'}
                  if 'attempt_recorded' in row:assert type(row['attempt_recorded']) is bool
                  if 'owned_containers' in row:
                      assert set(row['owned_containers'])<={'backend','frontend'} and all(re.fullmatch(r'[a-f0-9]{64}',x) for x in row['owned_containers'].values())
                  if 'rollback' in row:
                      assert set(row['rollback'])<={'backend','frontend'} and all(x in {'NO_CONTAINER_OBSERVED','CREATED_NOT_STARTED','STOPPED','UNCONFIRMED_REQUIRES_REVIEW'} for x in row['rollback'].values())
              assert len(v['containers'])==2
              for row in v['containers']:
                  assert set(row)=={'id','service','nonce','running','status','health','started'}
                  assert re.fullmatch(r'[a-f0-9]{64}',row['id']) and row['service'] in {'backend','frontend'} and row['nonce']=='9128e22668c33a1552f912415c800939'
                  assert type(row['running']) is bool and row['status'] in {'created','running','exited'} and row['health'] in {None,'starting','healthy','unhealthy'}
                  assert re.fullmatch(r'[0-9TZ:.-]{20,40}',row['started'])
              assert len(v['services'])==3 and all(x in {'postgres=running','backend=created','backend=running','backend=exited','frontend=created','frontend=running','frontend=exited'} for x in v['services'])
              a=v['frontend_assets']
              assert set(a)=={'index_sha256','theme_sha256','nginx_sha256','references','csp'}
              assert all(re.fullmatch(r'[a-f0-9]{64}',a[k]) for k in ('index_sha256','theme_sha256','nginx_sha256'))
              assert isinstance(a['references'],list) and len(a['references'])<=20
              for row in a['references']:
                  assert set(row)=={'kind','url'} and row['kind'] in {'script','stylesheet'}
                  assert isinstance(row['url'],str) and len(row['url'])<=2048 and not re.search(r'[\x00-\x20\x7f]',row['url'])
              assert isinstance(a['csp'],str) and len(a['csp'])<=2048 and not re.search(r'[\x00-\x1f\x7f]',a['csp'])
              return v

          module.GUEST_PROGRAM = guest
          module.validate_result = validate
          signal.signal(signal.SIGTERM, module.inspection.interrupted)
          signal.signal(signal.SIGINT, module.inspection.interrupted)
          raise SystemExit(module.main(['--inspect-existing-host-monitoring'], os.environ, module.inspection.Api))
          PY_INSPECT
