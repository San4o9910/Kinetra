name: Recheck exact backend after owner approved preserved continuation
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-candidate-validation-diagnostic.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the exact old inspection to remain unstarted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GUARD'
          import json, os, sys, urllib.error, urllib.request
          root = 'https://api.github.com/repos/San4o9910/Kinetra'
          path = '/actions/runs/34749066794'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('unexpected redirect')
          def get(suffix):
              req = urllib.request.Request(root + suffix, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.build_opener(NoRedirect).open(req, timeout=20) as response:
                  assert response.status == 200
                  return json.load(response)
          def verify(run):
              expected = {'id':34749066794, 'head_sha':'096393dae2c1fc977023bd0fccd17b2aa6758ace',
                  'head_branch':'ops/timeweb-hourly-preflight-20260909', 'run_attempt':1,
                  'path':'.github/workflows/kinetra-image-artifact-inspection.yml',
                  'workflow_id':354615253, 'event':'push', 'status':'queued', 'conclusion':None,
                  'created_at':'2026-09-13T09:10:29Z', 'updated_at':'2026-09-13T09:10:29Z'}
              assert all(run.get(key) == value for key, value in expected.items())
              assert run['repository']['id'] == 1339664626
              assert run['repository']['full_name'] == 'San4o9910/Kinetra'
          try:
              verify(get(path))
              for suffix, key in [('/jobs?filter=all&per_page=100','jobs'),
                                  ('/artifacts?per_page=100','artifacts')]:
                  value = get(path + suffix)
                  assert value.get('total_count') == 0 and value.get(key) == []
              verify(get(path))
          except Exception:
              print('KINETRA_REPLACEMENT_GUARD=STOP_REVIEW_OLD_RUN_BEFORE_HOST_ACCESS')
              sys.exit(1)
          print('KINETRA_REPLACEMENT_GUARD=PASS_EXACT_OLD_RUN_QUEUED_WITHOUT_JOBS')
          PY_GUARD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 096393dae2c1fc977023bd0fccd17b2aa6758ace
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect only nonsecret API preparation state on exact host
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          ROOT_SUPPLIED_SERVER_ID: '9069403'
          ROOT_SUPPLIED_SERVER_IP: 80.68.156.131
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict <<'SHA256'
          3ffc667a66330c323836d1335e78f92940d6ebdc1877cf66048265d774bb3086  ops/timeweb/inspect-host-monitoring.py
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          SHA256
          python3 -B - <<'PY_INSPECT'
          import importlib.util, json, os, re, signal, stat, sys

          spec = importlib.util.spec_from_file_location('kinetra_state_inspect', 'ops/timeweb/inspect-host-monitoring.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          guest = r'''
          import fcntl, hashlib, json, os, pathlib, re, stat, subprocess
          stage=pathlib.Path('/srv/kinetra-stage')
          lock=stage.parent
          descriptor=os.open('/run/kinetra-database-stage.lock',os.O_RDONLY|os.O_NOFOLLOW)
          fcntl.flock(descriptor,fcntl.LOCK_EX|fcntl.LOCK_NB)
          def metadata(path):
              info=path.lstat()
              return {'uid':info.st_uid,'gid':info.st_gid,'mode':oct(stat.S_IMODE(info.st_mode)),
                      'directory':stat.S_ISDIR(info.st_mode),'symlink':path.is_symlink(),
                      'device':info.st_dev,'inode':info.st_ino}
          initialized=json.loads((stage/'evidence/initialization.json').read_bytes())
          assert initialized['result']=='DATABASE_INITIALIZED_ONLY' and initialized['commit']=='73b665065e00a5b375e90f701373b3e0856a0386'
          proc=subprocess.run(['/usr/bin/docker','inspect','--format','{{json .Mounts}}',initialized['postgres_id']],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,check=True)
          mounts=json.loads(proc.stdout)
          data_mount=next(m for m in mounts if m['Destination']=='/var/lib/postgresql/data')
          assert data_mount['Type']=='volume' and data_mount['Name']=='kinetra-production_postgres17_data'
          proc=subprocess.run(['/usr/bin/docker','volume','inspect','--format','{{json .}}',data_mount['Name']],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,check=True)
          volume=json.loads(proc.stdout)
          assert volume['Driver']=='local' and volume['Options']=={'device':str(stage/'postgres/data'),'o':'bind','type':'none'}
          assert volume['Mountpoint']==data_mount['Source']
          result={'schema':1,'result':'PASS_READ_ONLY_INSPECTION','mutations':False,
                  'data_root':metadata(stage/'postgres/data'),'pgdata':metadata(stage/'postgres/data/pgdata'),
                  'mounted_root':metadata(pathlib.Path(data_mount['Source'])),
                  'volume_name':data_mount['Name'],'volume_bind_matches':True,
                  'postgres_version_17':(stage/'postgres/data/pgdata/PG_VERSION').read_bytes()==b'17\n',
                  'bootstrap_marker_exists':(stage/'postgres/data/pgdata/.kinetra-bootstrap-complete').is_file(),
                  'application_record_exists':(stage/'evidence/application-env.json').is_file(),
                  'recovery_complete_exists':(stage/'evidence/application-env-recovery-complete.json').is_file(),
                  'start_attempt_exists':(stage/'evidence/application-start-attempt.json').exists(),
                  'start_result_exists':(stage/'evidence/application-start-result.json').exists()}
          proc=subprocess.run(['/usr/bin/docker','ps','-a','--filter','label=com.docker.compose.project=kinetra-production',
              '--format','{{.Label "com.docker.compose.service"}}={{.State}}'],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,timeout=15,check=True,text=True)
          lines=proc.stdout.strip().splitlines()
          assert all(line in {'postgres=running','backend=created','backend=running','backend=exited','frontend=created','frontend=running','frontend=exited'} for line in lines)
          result['compose_services']=lines
          checkpoint=stage/'evidence/application-start-result.json'
          result['start_checkpoint']=None
          if checkpoint.exists():
              info=checkpoint.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=65536
              raw=checkpoint.read_bytes();value=json.loads(raw)
              assert value['result']=='CHECKPOINT_ONLY' and value['requires_matching_outer_success'] is True
              assert re.fullmatch(r'[A-Z_]{1,90}',value['phase'])
              assert value['error'] is None or re.fullmatch(r'[A-Z_]{1,90}',value['error'])
              result['start_checkpoint']={k:value[k] for k in ('phase','error','nonce','attempt_recorded',
                  'attempted_services','start_attempted_services','uncertain_start_services','owned_containers','rollback')}
              result['start_checkpoint']['sha256']=hashlib.sha256(raw).hexdigest()
          assert result['start_checkpoint']['sha256']=='ad5f14d8c643045b59275b4d0433cd9e96f63c1e4fba22dd1af7f3da7812548a'
          nonce=result['start_checkpoint']['nonce']
          args=['/usr/bin/docker','container','ls','--all','--quiet','--no-trunc','--filter',
              'label=com.docker.compose.project=kinetra-production','--filter','label=com.docker.compose.service=backend',
              '--filter','label=com.kinetra.activation='+nonce]
          p=subprocess.run(args,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=15,text=True)
          assert p.returncode==0
          ids=p.stdout.splitlines();assert len(ids)==1 and re.fullmatch(r'[a-f0-9]{64}',ids[0])
          template='{"id":{{json .Id}},"image":{{json .Config.Image}},"image_id":{{json .Image}},"user":{{json .Config.User}},"project":{{json (index .Config.Labels "com.docker.compose.project")}},"service":{{json (index .Config.Labels "com.docker.compose.service")}},"nonce":{{json (index .Config.Labels "com.kinetra.activation")}},"running":{{json .State.Running}},"status":{{json .State.Status}},"health":{{if .State.Health}}{{json .State.Health.Status}}{{else}}null{{end}},"readonly":{{json .HostConfig.ReadonlyRootfs}},"cap_drop":{{json .HostConfig.CapDrop}},"cap_add":{{json .HostConfig.CapAdd}},"security":{{json .HostConfig.SecurityOpt}},"ports":{{json .NetworkSettings.Ports}},"networks":{{json .NetworkSettings.Networks}},"mounts":{{json .Mounts}},"restart":{{json .HostConfig.RestartPolicy.Name}}}'
          p=subprocess.run(['/usr/bin/docker','inspect','--type','container','--format',template,ids[0]],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=15,text=True)
          safe_error='NONE' if p.returncode==0 else 'HEALTH_FIELD_ABSENT' if 'map has no entry for key "Health"' in p.stderr else 'OTHER_INSPECT_ERROR'
          safe_template='{"id":{{json .Id}},"image":{{json .Config.Image}},"project":{{json (index .Config.Labels "com.docker.compose.project")}},"service":{{json (index .Config.Labels "com.docker.compose.service")}},"nonce":{{json (index .Config.Labels "com.kinetra.activation")}},"running":{{json .State.Running}},"status":{{json .State.Status}},"started_at":{{json .State.StartedAt}}}'
          q=subprocess.run(['/usr/bin/docker','inspect','--type','container','--format',safe_template,ids[0]],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,text=True,check=True)
          identity=json.loads(q.stdout)
          assert identity['id']==ids[0] and identity['project']=='kinetra-production' and identity['service']=='backend' and identity['nonce']==nonce
          assert identity['image']=='ghcr.io/san4o9910/kinetra-backend@sha256:9138a6408442b847ca771690053870880cee831769919aaf2a2dc858d52e8362'
          assert identity['status']=='created' and identity['running'] is False and identity['started_at']=='0001-01-01T00:00:00Z'
          result['created_backend']={'id':ids[0],'nonce':nonce,'status':'created','never_started':True,
              'original_inspect_returncode':p.returncode,'original_inspect_error':safe_error}
          corrected=template.replace('{{if .State.Health}}','{{if (index .State "Health")}}')
          assert corrected!=template
          p=subprocess.run(['/usr/bin/docker','inspect','--type','container','--format',corrected,ids[0]],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,text=True,check=True)
          fixed=json.loads(p.stdout)
          assert fixed['id']==ids[0] and fixed['nonce']==nonce and fixed['status']=='created' and fixed['running'] is False and fixed['health'] is None
          assert fixed['image']==identity['image'] and fixed['project']=='kinetra-production' and fixed['service']=='backend'
          p=subprocess.run(['/usr/bin/docker','inspect','--type','container','--format',corrected,initialized['postgres_id']],
              stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,text=True,check=True)
          database=json.loads(p.stdout)
          assert database['id']==initialized['postgres_id'] and database['service']=='postgres' and database['running'] is True and database['health']=='healthy'
          result['query_validation']={'created_backend':'PASS_NULL_HEALTH','running_postgres':'PASS_HEALTHY',
              'mutations':False,'persistent_helper_changed':False}
          os.close(descriptor)
          print(json.dumps(result,sort_keys=True))
          '''
          def validate(raw):
              value=json.loads(raw)
              assert set(value)=={'schema','result','mutations','data_root','pgdata','mounted_root','volume_name',
                  'volume_bind_matches','postgres_version_17','bootstrap_marker_exists','application_record_exists','recovery_complete_exists','start_attempt_exists','start_result_exists','compose_services','start_checkpoint','created_backend','query_validation'}
              assert value['schema']==1 and value['result']=='PASS_READ_ONLY_INSPECTION' and value['mutations'] is False
              assert value['volume_name']=='kinetra-production_postgres17_data'
              for name in ('data_root','pgdata','mounted_root'):
                  row=value[name]
                  assert set(row)=={'uid','gid','mode','directory','symlink','device','inode'}
                  assert all(type(row[k]) is int and row[k]>=0 for k in ('uid','gid','device','inode'))
                  assert re.fullmatch(r'0o[0-7]{3,4}',row['mode'])
                  assert row['directory'] is True and row['symlink'] is False
              assert all(value[k] is True for k in ('volume_bind_matches','postgres_version_17','bootstrap_marker_exists'))
              assert all(type(value[k]) is bool for k in ('application_record_exists','recovery_complete_exists','start_attempt_exists','start_result_exists'))
              assert isinstance(value['compose_services'],list) and len(value['compose_services'])<=3
              item=value['start_checkpoint']
              if item is not None:
                  assert set(item)=={'phase','error','nonce','attempt_recorded','attempted_services','start_attempted_services',
                      'uncertain_start_services','owned_containers','rollback','sha256'}
                  assert re.fullmatch(r'[A-Z_]{1,90}',item['phase']) and (item['error'] is None or re.fullmatch(r'[A-Z_]{1,90}',item['error']))
                  assert item['nonce'] is None or re.fullmatch(r'[a-f0-9]{32}',item['nonce'])
                  assert re.fullmatch(r'[a-f0-9]{64}',item['sha256']) and type(item['attempt_recorded']) is bool
                  for key in ('attempted_services','start_attempted_services','uncertain_start_services'):
                      assert isinstance(item[key],list) and len(item[key])<=2 and set(item[key])<={'backend','frontend'}
                  assert isinstance(item['owned_containers'],dict) and set(item['owned_containers'])<={'backend','frontend'}
                  assert all(re.fullmatch(r'[a-f0-9]{64}',cid) for cid in item['owned_containers'].values())
                  assert set(item['rollback'])<={'backend','frontend'}
                  assert all(v in {'NO_CONTAINER_OBSERVED','CREATED_NOT_STARTED','STOPPED','UNCONFIRMED_REQUIRES_REVIEW'} for v in item['rollback'].values())
              backend=value['created_backend']
              assert set(backend)=={'id','nonce','status','never_started','original_inspect_returncode','original_inspect_error'}
              assert re.fullmatch(r'[a-f0-9]{64}',backend['id']) and backend['nonce']==item['nonce']
              assert backend['status']=='created' and backend['never_started'] is True
              assert type(backend['original_inspect_returncode']) is int and backend['original_inspect_returncode'] in range(256)
              assert backend['original_inspect_error'] in {'NONE','HEALTH_FIELD_ABSENT','OTHER_INSPECT_ERROR'}
              assert value['query_validation']=={'created_backend':'PASS_NULL_HEALTH','running_postgres':'PASS_HEALTHY',
                  'mutations':False,'persistent_helper_changed':False}
              return value

          module.GUEST_PROGRAM = guest
          module.validate_result = validate
          signal.signal(signal.SIGTERM, module.inspection.interrupted)
          signal.signal(signal.SIGINT, module.inspection.interrupted)
          raise SystemExit(module.main(['--inspect-existing-host-monitoring'], os.environ, module.inspection.Api))
          PY_INSPECT
