name: Bootstrap existing hourly Kinetra host
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths:
      - .github/workflows/timeweb-server-bootstrap.yml
      - ops/timeweb/bootstrap-server.py
      - ops/timeweb/test-bootstrap-server.py
permissions:
  contents: read
  actions: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'San4o9910/Kinetra'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed source and green mandatory source evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          sha256sum --check --strict <<'SHA256'
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          3ffc667a66330c323836d1335e78f92940d6ebdc1877cf66048265d774bb3086  ops/timeweb/inspect-host-monitoring.py
          a19aca3ea953feecdcb9be6e9dcabdfc8b0e2b4f3938184391cdfb2ff3e87c9e  ops/timeweb/bootstrap-server.py
          04c1b798104c3c7e7cff47af1f9300e4e4b6197207e2940c66790732cc4bec9c  ops/timeweb/test-bootstrap-server.py
          SHA256
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34406930670 --jq '.status')" = completed
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34406930670 --jq '.conclusion')" = success
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34406930670 --jq '.head_sha')" = 88199890d6f636fcf781d924137b15847a87e601
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34406934645 --jq '.status')" = completed
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34406934645 --jq '.conclusion')" = success
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34406934645 --jq '.head_sha')" = 88199890d6f636fcf781d924137b15847a87e601
          # Guest file ownership checks require root-owned disposable fixtures.
          # No cloud credentials or inherited environment reach these offline tests.
          sudo --non-interactive env -i PATH=/usr/bin:/bin python3 ops/timeweb/test-bootstrap-server.py
      - name: Install host prerequisites on server 9069403 with pinned SSH identity
        shell: bash
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/bootstrap-server.py --bootstrap-existing-empty-server
