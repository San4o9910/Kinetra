name: Bootstrap existing hourly Kinetra host
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths:
      - .github/workflows/timeweb-server-bootstrap.yml
      - ops/timeweb/bootstrap-server.py
      - ops/timeweb/test-bootstrap-server.py
permissions:
  contents: read
  actions: read
concurrency:
  group: kinetra-timeweb-hourly-provision
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'San4o9910/Kinetra'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed source and green mandatory candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          sha256sum --check --strict <<'SHA256'
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          af7374f2ed3f3bf8a1b72825e6ca01e1db873284c56c30ccb8ebcc16ca221f71  ops/timeweb/bootstrap-server.py
          2c5cd99a2c32ffa3e31fcdc5a1cccc1d8f0f51256c25de0e05309c25e6524c96  ops/timeweb/test-bootstrap-server.py
          SHA256
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34404918625 --jq '.status')" = completed
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34404918625 --jq '.conclusion')" = success
          test "$(gh api repos/San4o9910/Kinetra/actions/runs/34404918625 --jq '.head_sha')" = 6c7fb00411bd24c74d2a685a4077b45f8bf52850
          # Guest file ownership checks require root-owned disposable fixtures.
          # No cloud credentials or inherited environment reach these offline tests.
          sudo --non-interactive env -i PATH=/usr/bin:/bin python3 ops/timeweb/test-bootstrap-server.py
      - name: Install host prerequisites on server 9069403 with pinned SSH identity
        shell: bash
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          python3 ops/timeweb/bootstrap-server.py --bootstrap-existing-empty-server
