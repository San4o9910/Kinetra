name: Inspect Kinetra Timeweb API before application retry
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-image-artifact-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read only exact existing server identity
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict <<'SHA256'
          6b63573205b874c03d08e6147eec364928630ff094100848a7146382700740ea  ops/timeweb/prepare-api-host.py
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          SHA256
          python3 -B - <<'PY_INSPECT'
          import importlib.util, os, re, sys, time
          spec = importlib.util.spec_from_file_location('kinetra_api_inspect', 'ops/timeweb/prepare-api-host.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          token = os.environ.pop('TIMEWEB_CLOUD_TOKEN', '')
          try:
              module.require(token and len(token) <= 16384 and not any(ch.isspace() for ch in token),
                             'TIMEWEB_SECRET_MISSING_OR_INVALID')
              api = module.inspection.Api(token, 9069403, time.monotonic() + 120)
              token = ''
              server = module.inspection.validate_server(api.request('GET', '/servers/9069403'),
                                                         9069403, '80.68.156.131')
              module.require(server['server_status'] == 'on', 'EXISTING_SERVER_NOT_ON')
              print('KINETRA_TIMEWEB_READ_ONLY=' + __import__('json').dumps({
                  'server_id': 9069403, 'public_ipv4': '80.68.156.131',
                  'server_status': server['server_status'], 'result': 'PASS'
              }, sort_keys=True))
          except (module.Error, module.activation.Error) as error:
              category = str(error)
              if not re.fullmatch(r'[A-Z_]{1,90}', category):
                  category = 'TIMEWEB_READ_FAILED'
              print('KINETRA_TIMEWEB_READ_ONLY=FAIL:' + category, file=sys.stderr)
              raise SystemExit(1)
          finally:
              token = ''
          PY_INSPECT
