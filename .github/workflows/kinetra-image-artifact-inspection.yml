name: Inspect latest sanitized Kinetra application preparation attempt
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-image-artifact-inspection.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read only the exact sanitized application-attempt artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY_INSPECT'
          import hashlib, io, json, os, re, stat, urllib.error, urllib.parse, urllib.request, zipfile

          REPOSITORY = 'San4o9910/Kinetra'
          RUN = 34748921875
          CONTROL = '5021035f1e56cf935b177bd6a54e3ce95d322a7a'
          ARTIFACT = 10315336650
          DIGEST = '1aacc165460f8e134ee99cdba94c0575d50768057218b7a95c8c7bc2fa36bf2b'
          NAME = 'kinetra-local-attempt-34748921875-1'
          ALLOWED = {'api-outer.json', 'local-outer.json',
                     'api-outer.observations.jsonl', 'local-outer.observations.jsonl'}

          assert os.environ['GITHUB_REPOSITORY'] == REPOSITORY
          assert os.environ['GITHUB_REF'] == 'refs/heads/ops/timeweb-hourly-preflight-20260909'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, new_url):
                  return None
          opener = urllib.request.build_opener(NoRedirect)

          def fetch(path, archive=False):
              req = urllib.request.Request('https://api.github.com/repos/' + REPOSITORY + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              try:
                  response = opener.open(req, timeout=30)
              except urllib.error.HTTPError as error:
                  if not archive or error.code != 302:
                      raise RuntimeError('Artifact API read failed') from None
                  location = error.headers['Location']
                  parsed = urllib.parse.urlsplit(location)
                  assert parsed.scheme == 'https' and not parsed.username and not parsed.password
                  assert parsed.port in (None, 443) and parsed.hostname
                  assert parsed.hostname.endswith(('.blob.core.windows.net', '.actions.githubusercontent.com'))
                  response = opener.open(urllib.request.Request(location), timeout=30)
              with response:
                  data = response.read(128 * 1024 + 1)
              assert len(data) <= 128 * 1024
              return data if archive else json.loads(data)

          metadata = fetch('/actions/artifacts/' + str(ARTIFACT))
          assert metadata['id'] == ARTIFACT and metadata['name'] == NAME and metadata['expired'] is False
          assert metadata['size_in_bytes'] <= 64 * 1024
          assert metadata['digest'] == 'sha256:' + DIGEST
          assert metadata['workflow_run']['id'] == RUN
          assert metadata['workflow_run']['head_sha'] == CONTROL

          raw = fetch('/actions/artifacts/' + str(ARTIFACT) + '/zip', archive=True)
          assert hashlib.sha256(raw).hexdigest() == DIGEST

          def pairs(items):
              output = {}
              for key, value in items:
                  assert key not in output
                  output[key] = value
              return output
          def nonfinite(_value):
              raise ValueError('nonfinite')
          def strict(raw_json):
              return json.loads(raw_json, object_pairs_hook=pairs, parse_constant=nonfinite)
          sensitive = re.compile(r'(secret|token|password|authorization|credential|smtp|username|email)', re.I)
          def sanitized(value):
              if isinstance(value, dict):
                  return {key: ('<redacted>' if sensitive.search(key) else sanitized(item))
                          for key, item in value.items()}
              if isinstance(value, list):
                  assert len(value) <= 100
                  return [sanitized(item) for item in value]
              if isinstance(value, str):
                  if len(value) > 512 or '@' in value or re.search(r'(?i)bearer\\s|basic\\s', value):
                      return '<redacted>'
                  return value
              assert value is None or type(value) in (bool, int, float)
              return value

          result = {}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              assert names and len(names) == len(set(names)) and set(names) <= ALLOWED
              for info in infos:
                  assert not info.is_dir() and '/' not in info.filename and '\\\\' not in info.filename
                  assert not info.flag_bits & 1 and 0 < info.file_size <= 64 * 1024
                  mode = (info.external_attr >> 16) & 0o170000
                  assert mode in (0, stat.S_IFREG)
                  data = archive.read(info)
                  if info.filename.endswith('.json'):
                      result[info.filename] = sanitized(strict(data))
                  else:
                      lines = data.splitlines()
                      assert len(lines) <= 100
                      result[info.filename] = [sanitized(strict(line)) for line in lines if line]
          print('KINETRA_SANITIZED_APPLICATION_ATTEMPT=' + json.dumps(result, sort_keys=True))
          print('KINETRA_APPLICATION_ATTEMPT_INSPECTION=PASS')
          PY_INSPECT
