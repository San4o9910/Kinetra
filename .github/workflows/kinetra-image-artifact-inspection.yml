name: Verify Kinetra API helper dependency correction
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-image-artifact-inspection.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact corrected dependency chain and offline tests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict <<'SHA256'
          f549bdda5c325ce4d36a2be239bb6458f79f5d011d3e5ec61e9158388377377a  ops/timeweb/prepare-api-host.py
          22b4c0fe509d2b5d96209e4031604a493cf2aa5baeafd4bfdfce4c890b8ff357  ops/timeweb/activate-local-application-host.py
          598d82e4d00b54606be8cd6c9ebc872d3a62ebd9786b250cad267a4f1e1df844  ops/timeweb/application-caller.py
          6dba697be21ee9429a63a67309a7e359ef5c47e67dc347a20e7a90fc5e7d840a  ops/timeweb/https-caller.py
          51138875302c90ada0ddce03a432ee2210ae245d2b40e2985e10df41878ef0ad  ops/timeweb/test-prepare-api-host.py
          d9825e47848e9703bd75192ed695adb4b12a8eed56e03976b43b345e61064258  ops/timeweb/test-activate-local-application-host.py
          444528e29fa1b280a78989727911a9f6c5025f285a30bed5af0f31fc0ea396c8  ops/timeweb/test-application-caller.py
          45130035b0124170fc219eae702e9422fbe1a2134f73b0f5ef0a63a39b120611  ops/timeweb/test-https-caller.py
          SHA256
          python3 -m py_compile ops/timeweb/prepare-api-host.py ops/timeweb/activate-local-application-host.py ops/timeweb/application-caller.py ops/timeweb/https-caller.py
          PYTHONDONTWRITEBYTECODE=1 python3 ops/timeweb/test-prepare-api-host.py
          PYTHONDONTWRITEBYTECODE=1 python3 ops/timeweb/test-activate-local-application-host.py
          env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 python3 ops/timeweb/test-application-caller.py
          env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 python3 ops/timeweb/test-https-caller.py
          python3 - <<'PY_VERIFY'
          import ast, hashlib
          files = {
              'prepare': ('ops/timeweb/prepare-api-host.py', 'f549bdda5c325ce4d36a2be239bb6458f79f5d011d3e5ec61e9158388377377a'),
              'local': ('ops/timeweb/activate-local-application-host.py', '22b4c0fe509d2b5d96209e4031604a493cf2aa5baeafd4bfdfce4c890b8ff357'),
              'caller': ('ops/timeweb/application-caller.py', '598d82e4d00b54606be8cd6c9ebc872d3a62ebd9786b250cad267a4f1e1df844'),
              'https': ('ops/timeweb/https-caller.py', '6dba697be21ee9429a63a67309a7e359ef5c47e67dc347a20e7a90fc5e7d840a'),
          }
          for path, expected in files.values():
              raw=open(path,'rb').read()
              assert hashlib.sha256(raw).hexdigest()==expected
              ast.parse(raw, filename=path)
          source=open(files['prepare'][0],encoding='utf-8').read()
          assert source.count('"inspect-host-monitoring.py": "3ffc667a66330c323836d1335e78f92940d6ebdc1877cf66048265d774bb3086"') == 1
          print('KINETRA_API_HELPER_DEPENDENCY_CORRECTION=PASS')
          PY_VERIFY
