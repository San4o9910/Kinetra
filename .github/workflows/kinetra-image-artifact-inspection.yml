name: Diagnose Kinetra pre-candidate handoff without changes
on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-image-artifact-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact read-only handoff invariants on server 9069403
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          ROOT_SUPPLIED_SERVER_ID: '9069403'
          ROOT_SUPPLIED_SERVER_IP: 80.68.156.131
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict <<'SHA256'
          3ffc667a66330c323836d1335e78f92940d6ebdc1877cf66048265d774bb3086  ops/timeweb/inspect-host-monitoring.py
          567d892221925bb438ece6a893360a891ffd4228f8af0a18252b8ba365a682c0  ops/timeweb/inspect-server.py
          SHA256
          python3 -B - <<'PY_INSPECT'
          import importlib.util, json, os, re, signal

          spec = importlib.util.spec_from_file_location('kinetra_handoff_inspect', 'ops/timeweb/inspect-host-monitoring.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          guest = r'''
          import hashlib, json, os, pathlib, re, stat
          stage = pathlib.Path('/srv/kinetra-stage')
          expected_commit = '73b665065e00a5b375e90f701373b3e0856a0386'
          expected_images = {
            'NODE_IMAGE':'node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32',
            'NGINX_IMAGE':'nginxinc/nginx-unprivileged@sha256:3a4485bf084957d56674ee22db07d77d5a281418815c5852827419d6d629d440',
            'BACKEND_IMAGE':'ghcr.io/san4o9910/kinetra-backend@sha256:9138a6408442b847ca771690053870880cee831769919aaf2a2dc858d52e8362',
            'FRONTEND_IMAGE':'ghcr.io/san4o9910/kinetra-frontend@sha256:da47e7f576cfb3892b9078e8463cdad855081e032d51645639794736c1098ff2',
            'POSTGRES_IMAGE':'postgres:17-bookworm@sha256:7bade6d532592ca8ce7ee32def7399dad2607c4ea5583839fc4352a095a11ea6'}
          def identity(path):
              if not path.exists() or path.is_symlink(): return None
              info = path.lstat()
              kind = 'file' if stat.S_ISREG(info.st_mode) else 'dir' if stat.S_ISDIR(info.st_mode) else 'other'
              return {'kind':kind,'uid':info.st_uid,'mode':oct(stat.S_IMODE(info.st_mode))}
          def read_json(path):
              raw = path.read_bytes()
              assert len(raw) <= 131072
              return json.loads(raw)
          def parse_env(path):
              values = {}
              for line in path.read_text('ascii').splitlines():
                  if not line.strip() or line.lstrip().startswith('#'): continue
                  match = re.fullmatch(r'([A-Z][A-Z0-9_]*)=(.*)', line)
                  assert match and match[1] not in values
                  values[match[1]] = match[2]
              return values
          staged = read_json(stage / 'evidence/stage.json')
          initialized = read_json(stage / 'evidence/initialization.json')
          source_mismatches = []
          for name, expected in staged.get('source_hashes', {}).items():
              path = stage / 'source' / name
              observed = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() and not path.is_symlink() else None
              if observed != expected: source_mismatches.append(name)
          api = parse_env(stage / 'env/api.env')
          production = parse_env(stage / 'env/production.env')
          expected_production = {key:expected_images[key] for key in ('NODE_IMAGE','NGINX_IMAGE','BACKEND_IMAGE','FRONTEND_IMAGE')}
          expected_production.update(VCS_REF=expected_commit,VITE_API_URL='https://80.68.156.131',
              VITE_PRIVATE_MEDIA_ORIGIN='',KINETRA_API_ENV_FILE='/srv/kinetra-stage/env/api.env',KINETRA_VIDEO_SCRATCH_DIR='')
          result = {'schema':1,'result':'PASS_READ_ONLY_INSPECTION','mutations':False,
            'stage_identity':identity(stage),'lock_identity':identity(pathlib.Path('/run/kinetra-database-stage.lock')),
            'stage_result':staged.get('result'),'stage_commit_matches':staged.get('commit') == expected_commit,
            'stage_images_match':staged.get('images') == expected_images,
            'stage_image_matches':{key:staged.get('images',{}).get(key) == value for key,value in expected_images.items()},
            'stage_source_count':len(staged.get('source_hashes',{})),'source_mismatches':sorted(source_mismatches),
            'initialization_result':initialized.get('result'),
            'initialization_commit_matches':initialized.get('commit') == expected_commit,
            'initialization_images_match':initialized.get('images') == expected_images,
            'initialization_image_matches':{key:initialized.get('images',{}).get(key) == value for key,value in expected_images.items()},
            'migration_count':len(initialized.get('migration_hashes',{})),
            'api_identity':identity(stage / 'env/api.env'),'api_keys':sorted(api),
            'api_exact_node_only':api == {'NODE_ENV':'production'},
            'production_identity':identity(stage / 'env/production.env'),
            'production_keys':sorted(production),'production_exact':production == expected_production,
            'attempt_exists':(stage / 'evidence/application-env-attempt.json').exists(),
            'record_exists':(stage / 'evidence/application-env.json').exists()}
          print(json.dumps(result, sort_keys=True))
          '''

          def validate(raw):
              value = json.loads(raw)
              assert isinstance(value, dict) and value.get('schema') == 1
              assert value.get('result') == 'PASS_READ_ONLY_INSPECTION' and value.get('mutations') is False
              assert isinstance(value.get('stage_image_matches'), dict)
              assert isinstance(value.get('initialization_image_matches'), dict)
              assert isinstance(value.get('source_mismatches'), list)
              return value

          module.GUEST_PROGRAM = guest
          module.validate_result = validate
          signal.signal(signal.SIGTERM, module.inspection.interrupted)
          signal.signal(signal.SIGINT, module.inspection.interrupted)
          raise SystemExit(module.main(['--inspect-existing-host-monitoring'], os.environ, module.inspection.Api))
          PY_INSPECT
