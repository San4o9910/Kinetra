        run: |
          set -euo pipefail
          python3 - <<'PY_TEST_ENV'
          import os
          names = ['DATABASE_URL', 'JWT_ACCESS_SECRET', 'JWT_REFRESH_SECRET', 'NODE_ENV', 'PORT', 'HOST', 'CORS_ORIGIN', 'YUKASSA_SHOP_ID', 'YUKASSA_SECRET_KEY', 'YUKASSA_RETURN_URL', 'YUKASSA_REQUEST_TIMEOUT_MS', 'VAPID_PUBLIC_KEY', 'VAPID_PRIVATE_KEY', 'VAPID_SUBJECT', 'CHAT_ENABLED', 'CHAT_PHOTO_UPLOADS_ENABLED', 'CHAT_PHOTO_UPLOAD_IDLE_TIMEOUT_SECONDS', 'CHAT_PHOTO_UPLOAD_TOTAL_TIMEOUT_SECONDS', 'CHAT_MEDIA_URL_TTL_SECONDS', 'CI', 'KINETRA_REQUIRE_POSTGRES_TEST', 'KINETRA_REQUIRE_S3_TEST', 'KINETRA_S3_TEST_ENDPOINT', 'KINETRA_S3_TEST_ACCESS_KEY', 'KINETRA_S3_TEST_SECRET_KEY']
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              for name in names:
                  value = os.environ[name]
                  assert '\n' not in value and '\r' not in value
                  target.write(name + '=' + value + '\n')
          PY_TEST_ENV

      - name: Start isolated PostgreSQL 17 fixture after ordinary quality
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name kinetra-precommit-postgres \
            --publish 5432:5432 \
            --env POSTGRES_DB=kinetra_test \
            --env POSTGRES_USER=kinetra \
            --env POSTGRES_PASSWORD=kinetra_test_ci \
            --health-cmd 'pg_isready -U kinetra -d kinetra_test' \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgres:17-alpine
          ready='false'
          for _ in $(seq 1 60); do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' kinetra-precommit-postgres)" == 'healthy' ]]; then
              ready='true'
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 'true' ]]; then
            docker logs kinetra-precommit-postgres
            exit 1
          fi
          echo 'KINETRA_PRECOMMIT_POSTGRES_FIXTURE_READY=PASS'

