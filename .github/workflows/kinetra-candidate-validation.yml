# New bounded resume authorized after STOP from run34399036669; activate this corrected tree once.
# Keep this control workflow separate from the candidate Git tree and its manifest.
# It never creates an application commit, updates a ref, opens a PR, or deploys.
name: Kinetra PRECOMMIT_CANDIDATE_TREE validation
run-name: Kinetra PRECOMMIT_CANDIDATE_TREE CLI resume

on:
  push:
    branches: [ops/timeweb-hourly-preflight-20260909]
    paths: [.github/workflows/kinetra-candidate-validation.yml]

permissions:
  contents: read

concurrency:
  group: kinetra-precommit-candidate-b4259c1ab0e211cb1806592affaee7923ee60aed
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  VITE_API_URL: https://api.ci.kinetra.test
  BASE_COMMIT_SHA: '4ae3f1b97849982c92f703e4a446f7968a474039'
  CANDIDATE_TREE_SHA: 'b4259c1ab0e211cb1806592affaee7923ee60aed'
  FORCE_COLOR: '0'

jobs:
  validation:
    name: PRECOMMIT_CANDIDATE_TREE sequential validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: San4o9910/Kinetra
          ref: 4ae3f1b97849982c92f703e4a446f7968a474039
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize and identify PRECOMMIT_CANDIDATE_TREE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY_MATERIALIZE'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.request

          BASE = "4ae3f1b97849982c92f703e4a446f7968a474039"
          TREE = os.environ["CANDIDATE_TREE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", TREE), "Root must supply the reviewed immutable candidate tree SHA before activation."
          assert os.environ["BASE_COMMIT_SHA"] == BASE
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert os.environ["GITHUB_REF"] == "refs/heads/ops/timeweb-hourly-preflight-20260909"
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "STOP: reruns are prohibited."

          def git(*args, data=None):
              return subprocess.check_output(["git", *args], input=data)

          assert git("rev-parse", "HEAD").decode().strip() == BASE
          assert git("status", "--porcelain", "--untracked-files=all") == b"", "Checkout must start clean."

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("GitHub API redirect rejected; do not change source identity.")

          opener = urllib.request.build_opener(NoRedirect)
          def api(suffix):
              request = urllib.request.Request(
                  "https://api.github.com/repos/San4o9910/Kinetra/git/" + suffix,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with opener.open(request, timeout=30) as response:
                  return json.load(response)

          def valid_path(path):
              assert isinstance(path, str) and path
              assert not path.startswith("/") and "\\" not in path
              assert not any(ord(char) < 32 or ord(char) == 127 for char in path)
              assert all(part not in ("", ".", "..") and part.casefold() != ".git" for part in path.split("/"))
              return path

          prefixes = ("apps/frontend/", "apps/backend/", "deploy/", "ops/", "docs/")
          exact = {
              "scripts/verify-project.mjs", "scripts/test-frontend-browser.mjs", ".env.example",
              ".github/workflows/ci.yml", "README.md", "package-lock.json", "MANIFEST.sha256",
          }
          def allowed(path):
              return path.startswith(prefixes) or path in exact

          baseline = {}
          for entry in git("ls-tree", "-rz", BASE).split(b"\0"):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, kind, sha = metadata.decode("ascii").split(" ")
              path = valid_path(raw_path.decode("utf-8"))
              assert kind == "blob" and mode in ("100644", "100755"), "Unsupported base entry."
              baseline[path] = (mode, sha)

          response = api("trees/" + TREE + "?recursive=1")
          assert response.get("sha") == TREE
          assert response.get("truncated") is False, "A truncated tree cannot identify the candidate."
          candidate = {}
          for entry in response["tree"]:
              path = valid_path(entry["path"])
              if entry["type"] == "tree":
                  assert entry["mode"] == "040000"
                  continue
              assert entry["type"] == "blob" and entry["mode"] in ("100644", "100755"), "Symlinks and submodules are prohibited."
              assert re.fullmatch(r"[0-9a-f]{40}", entry["sha"])
              assert path not in candidate, "Duplicate candidate path."
              candidate[path] = (entry["mode"], entry["sha"])

          changed = sorted(path for path in baseline.keys() | candidate.keys() if baseline.get(path) != candidate.get(path))
          assert changed, "No candidate changes."
          for path in changed:
              assert allowed(path), "Candidate change outside allowlist: " + path

          # Download only changed immutable blobs. Never fetch or execute a branch-tip application.
          for path in changed:
              if path not in candidate:
                  continue
              mode, sha = candidate[path]
              if baseline.get(path, (None, None))[1] == sha:
                  continue
              blob = api("blobs/" + sha)
              assert blob.get("sha") == sha and blob.get("encoding") == "base64"
              content = base64.b64decode(blob["content"].replace("\n", "").replace("\r", ""), validate=True)
              assert len(content) == blob["size"]
              assert hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest() == sha
              assert git("hash-object", "-w", "--stdin", data=content).decode().strip() == sha

          # Only this disposable checkout receives an index update; no commit or ref is created.
          for path in changed:
              if path not in candidate:
                  git("update-index", "--force-remove", "--", path)
                  old_path = pathlib.Path(path)
                  if old_path.is_file() or old_path.is_symlink():
                      old_path.unlink()
          for path in changed:
              if path in candidate:
                  mode, sha = candidate[path]
                  git("update-index", "--add", "--cacheinfo", mode + "," + sha + "," + path)
          assert git("write-tree").decode().strip() == TREE, "Computed Git tree does not match root-supplied candidate."
          git("checkout-index", "--all", "--force")
          git("diff", "--exit-code")
          assert git("ls-files", "--others", "--exclude-standard", "-z") == b""
          assert git("rev-parse", "HEAD").decode().strip() == BASE
          assert git("write-tree").decode().strip() == TREE

          summary = (
              "Validation semantics: PRECOMMIT_CANDIDATE_TREE\n"
              f"Application repository: San4o9910/Kinetra\nBase commit: {BASE}\n"
              f"Candidate Git tree: {TREE}\nChanged paths: {len(changed)}\n"
              "HEAD remains the base commit; application changes exist only in the index and worktree.\n"
          )
          print(summary)
          print("KINETRA_PRECOMMIT_CANDIDATE_TREE_MATERIALIZATION=PASS")
          for path in changed:
              print("Candidate changed path: " + path)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(summary + "\n")
          PY_MATERIALIZE

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify candidate formatting with the real base and staged diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FORMAT'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'kinetra-format-base.json').write_text(
              json.dumps({'before': os.environ['BASE_COMMIT_SHA']})
          )
          PY_FORMAT
          GITHUB_BASE_REF='' GITHUB_EVENT_PATH="$RUNNER_TEMP/kinetra-format-base.json" npm run format:changed

      - name: Verify deployment configuration and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          node --test ops/test-production-env.mjs
          for script in ops/*.sh; do bash -n "$script"; done

      - name: Build
        run: npm run build

      - name: Verify project structure
        run: node scripts/verify-project.mjs

      - name: Verify source manifest against the candidate index
        shell: bash
        run: |
          set -euo pipefail
          diff -u \
            <(git ls-files | sed '/^MANIFEST\.sha256$/d' | sed 's#^#./#' | LC_ALL=C sort) \
            <(awk '{ print $2 }' MANIFEST.sha256 | LC_ALL=C sort)
          sha256sum -c MANIFEST.sha256

      - name: Confirm candidate identity after ordinary quality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT_SHA"
          test "$(git write-tree)" = "$CANDIDATE_TREE_SHA"
          git diff --exit-code
          echo 'KINETRA_PRECOMMIT_ORDINARY_QUALITY=PASS'
          echo 'Ordinary quality passed. The PG17/S3/browser gate is still NOT_RUN.' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure deterministic mandatory test fixtures after ordinary quality
        shell: bash
        env:
