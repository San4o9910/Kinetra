          echo 'KINETRA_T10_TEST_SUITE=PASS'
          echo 'KINETRA_T11_TEST_SUITE=PASS'
          echo 'KINETRA_T13_TEST_SUITE=PASS'
          echo 'KINETRA_T12_TEST_SUITE=PASS'
          echo 'KINETRA_T14_TEST_SUITE=PASS'

      - name: Require complete suites and exact test-output markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_EVIDENCE'
          import pathlib, re
          log = pathlib.Path('/tmp/kinetra-test.log').read_text()
          for field in ('tests', 'pass', 'fail', 'cancelled', 'skipped', 'todo'):
              values = [int(value) for value in re.findall(r'^(?:#|ℹ) ' + field + r' ([0-9]+)$', log, re.MULTILINE)]
              assert len(values) == 2, f'Expected both backend and frontend-unit completed summaries for {field}, got {values}.'
              if field in ('tests', 'pass'):
                  assert all(value > 0 for value in values), f'An empty suite is prohibited: {field}={values}.'
              else:
                  assert values == [0, 0], f'Failure, cancellation, skip or TODO blocks release: {field}={values}.'
          required = ['KINETRA_T04_POSTGRES_INTEGRATION=PASS', 'KINETRA_T04_BROWSER_E2E=PASS', 'KINETRA_T05_POSTGRES_INTEGRATION=PASS', 'KINETRA_T05_BROWSER_E2E=PASS', 'KINETRA_T06_BACKEND_E2E=PASS', 'KINETRA_T06_POSTGRES_INTEGRATION=PASS', 'KINETRA_T06_BROWSER_E2E=PASS', 'KINETRA_T07_BACKEND_E2E=PASS', 'KINETRA_T07_POSTGRES_INTEGRATION=PASS', 'KINETRA_T07_PLAYER_TAB_HISTORY=PASS', 'KINETRA_T07_BROWSER_E2E=PASS', 'KINETRA_T08_BACKEND_E2E=PASS', 'KINETRA_T08_CARD_NAVIGATION=PASS', 'KINETRA_T08_COMPLETION_STATE=PASS', 'KINETRA_T08_BROWSER_E2E=PASS', 'KINETRA_T09_BACKEND_E2E=PASS', 'KINETRA_T09_POSTGRES_INTEGRATION=PASS', 'KINETRA_T09_PROGRESS_CONTENT=PASS', 'KINETRA_T09_GOAL_UPDATE=PASS', 'KINETRA_T09_WEEKLY_METRICS=PASS', 'KINETRA_T09_CHARTS=PASS', 'KINETRA_T09_BROWSER_E2E=PASS', 'KINETRA_T10_BACKEND_E2E=PASS', 'KINETRA_T10_POSTGRES_INTEGRATION=PASS', 'KINETRA_T10_SETTINGS_CONTENT=PASS', 'KINETRA_T10_NOTIFICATIONS=PASS', 'KINETRA_T10_THEME_MODES=PASS', 'KINETRA_T10_LOGOUT=PASS', 'KINETRA_T10_ACCOUNT_DELETION=PASS', 'KINETRA_T10_BROWSER_E2E=PASS', 'KINETRA_T11_YOOKASSA_CLIENT=PASS', 'KINETRA_T11_BACKEND_E2E=PASS', 'KINETRA_T11_WEBHOOK_AUTH=PASS', 'KINETRA_T11_WEBHOOK_IDEMPOTENCY=PASS', 'KINETRA_T11_POSTGRES_INTEGRATION=PASS', 'KINETRA_T11_RENEWAL_IDEMPOTENCY=PASS', 'KINETRA_T11_PAYMENT_FLOW=PASS', 'KINETRA_T11_PAYWALL=PASS', 'KINETRA_T11_SETTINGS_SUBSCRIPTION=PASS', 'KINETRA_T11_BROWSER_E2E=PASS', 'KINETRA_T13_WEBPUSH_SENDER=PASS', 'KINETRA_T13_BACKEND_E2E=PASS', 'KINETRA_T13_POSTGRES_INTEGRATION=PASS', 'KINETRA_T13_SCHEDULER=PASS', 'KINETRA_T13_SERVICE_WORKER=PASS', 'KINETRA_T13_PERMISSION_LIFECYCLE=PASS', 'KINETRA_T13_SETTINGS_INTEGRATION=PASS', 'KINETRA_T13_BROWSER_E2E=PASS', 'KINETRA_T12_BACKEND_E2E=PASS', 'KINETRA_T12_SOCKET_AUTHORIZATION=PASS', 'KINETRA_T12_MESSAGE_DELIVERY=PASS', 'KINETRA_T12_POSTGRES_INTEGRATION=PASS', 'KINETRA_T12_MULTIPART_TIMEOUT=PASS', 'KINETRA_T12_PHOTO_SECURITY=PASS', 'KINETRA_T12_CLIENT_UI=PASS', 'KINETRA_T12_TRAINER_ADMIN=PASS', 'KINETRA_T12_T13_COEXISTENCE=PASS', 'KINETRA_T12_BROWSER_E2E=PASS', 'KINETRA_T14_BACKEND_E2E=PASS', 'KINETRA_T14_UPLOAD_AUTHORIZATION=PASS', 'KINETRA_T14_S3_MULTIPART=PASS', 'KINETRA_T14_VIDEO_VERIFICATION=PASS', 'KINETRA_T14_POSTGRES_INTEGRATION=PASS', 'KINETRA_T14_TRAINER_UI=PASS', 'KINETRA_T14_UPLOAD_LIFECYCLE=PASS', 'KINETRA_T14_REPLACE_UNPUBLISH=PASS', 'KINETRA_T14_T07_T12_T13_COEXISTENCE=PASS', 'KINETRA_T14_BROWSER_E2E=PASS', 'KINETRA_TRAINER_VERIFICATION_MIGRATION_POSTGRES17=PASS', 'KINETRA_REGISTRATION_ROLES_POSTGRES17=PASS', 'KINETRA_SQLSTATE_42804_REGRESSION_POSTGRES17=PASS', 'KINETRA_REGISTRATION_PROFILE_POSTGRES17=PASS', 'KINETRA_TRAINER_VERIFICATION_REVIEWER_CLI_POSTGRES17=PASS', 'KINETRA_TRAINER_VERIFICATION_LIFECYCLE_POSTGRES17=PASS', 'KINETRA_TRAINER_VERIFICATION_APPROVAL_GUARDS_POSTGRES17=PASS', 'KINETRA_TRAINER_VERIFICATION_AUDIT_CASCADE_POSTGRES17=PASS', 'KINETRA_TRAINER_VERIFICATION_LATEST_REQUEST_POSTGRES17=PASS', 'KINETRA_T14_S3_LEGACY_CLEANUP=PASS', 'KINETRA_AUTH_LOGOUT_FAMILY_POSTGRES=PASS', 'KINETRA_AUTH_REFRESH_LOGOUT_SERIALIZATION=PASS', 'KINETRA_T11_ATTACH_MONOTONICITY=PASS', 'KINETRA_EXPLORATION_CHAT_LOCK=PASS', 'KINETRA_ONBOARDING_EXPLORATION_NAVIGATION=PASS', 'KINETRA_EXPLORATION_PAYWALL_PRECEDENCE=PASS']
          for marker in required:
              assert re.search(r'^(?:# |ℹ )?' + re.escape(marker) + r'$', log, re.MULTILINE), 'Missing asserted test-output marker: ' + marker
          print('KINETRA_PRECOMMIT_COMPLETED_SUITE_EVIDENCE=PASS')
          PY_EVIDENCE

      - name: Stop private S3 fixture
        if: always()
        shell: bash
        run: docker stop kinetra-t14-minio >/dev/null 2>&1 || true

      - name: Verify browser profile cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          leftovers="$(find /tmp -maxdepth 1 -type d -name 'kinetra-browser-*' -print)"
          if [[ -n "$leftovers" ]]; then
            echo 'Browser profile directories were not removed:' >&2
            echo "$leftovers" >&2
            exit 1
          fi
          echo 'KINETRA_BROWSER_TMP_CLEANUP=PASS'


      - name: Stop isolated PostgreSQL fixture
        if: always()
        shell: bash
        run: docker stop kinetra-precommit-postgres >/dev/null 2>&1 || true

      - name: Attest completed PRECOMMIT_CANDIDATE_TREE validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT_SHA"
          test "$(git write-tree)" = "$CANDIDATE_TREE_SHA"
          git diff --exit-code
          {
            echo 'Validation semantics: PRECOMMIT_CANDIDATE_TREE'
            echo "Base commit: $BASE_COMMIT_SHA"
            echo "Candidate Git tree: $CANDIDATE_TREE_SHA"
            echo "Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo 'KINETRA_PRECOMMIT_CANDIDATE_TREE_VALIDATION=PASS'
            echo 'This is precommit candidate evidence. PR-head and merge-ref evidence do not yet exist.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
