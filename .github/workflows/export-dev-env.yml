name: Export Kinetra dev environment

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/t04-profile-survey'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Upload repository with dependencies
        uses: actions/upload-artifact@v4
        with:
          name: kinetra-t04-dev-env
          path: |
            .
            !.git/**
            !**/dist/**
          include-hidden-files: true
          retention-days: 1
