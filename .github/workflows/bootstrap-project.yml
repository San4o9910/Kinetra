name: Bootstrap Kinetra repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore baseline archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/kinetra-baseline.tar.gz
          echo "fe60e1b11284ad9de5565c0317c9a9aa2eea1ddd0e4a00b355be558395b79d9d  /tmp/kinetra-baseline.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kinetra-baseline.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \
            ! -path './.git/*' \
            ! -path '*/node_modules/*' \
            ! -path '*/dist/*' \
            ! -name 'MANIFEST.sha256' \
            -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256

      - name: Commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: T01 foundation + T02 auth module + GitHub Actions CI' \
            -m 'Monorepo: @kinetra/frontend, @kinetra/backend, @kinetra/shared' \
            -m 'PWA foundation, JWT authentication, PostgreSQL auth migration, E2E tests and GitHub Actions CI.'
          git push origin HEAD:main
